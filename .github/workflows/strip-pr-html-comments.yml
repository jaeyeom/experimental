name: Strip PR HTML comments

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

concurrency:
  group: strip-pr-html-comments-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  strip:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Run the stripper from the base branch so a topic branch cannot
      # change the code that holds pull-requests: write. Fall back to this
      # PR's copy only while the script is still landing.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: pr

      - name: Strip HTML comments from PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -f trusted/scripts/strip_pr_html_comments.py ]; then
            script=trusted/scripts/strip_pr_html_comments.py
          else
            script=pr/scripts/strip_pr_html_comments.py
          fi
          json=$(mktemp)
          stripped=$(mktemp)
          trap 'rm -f "$json" "$stripped"' EXIT
          gh pr view "$PR_NUMBER" --json body > "$json"
          state=$(python3 "$script" "$json" "$stripped")
          if [ "$state" = "unchanged" ]; then
            echo "PR body already has no HTML comments to strip"
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --body-file "$stripped"
          echo "Stripped HTML comments from PR body"
