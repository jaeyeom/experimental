name: Check

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'codelab/flutter/**'
      - 'my-ts-project/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'codelab/flutter/**'
      - 'my-ts-project/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: "1.26.10"
        cache: true

    - name: Install uv and semgrep
      run: |
        set -eu
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT INT TERM
        curl -LsSf -o "$tmp" https://astral.sh/uv/install.sh
        sh "$tmp"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        PATH="$HOME/.local/bin:$PATH"
        export PATH
        uv tool install semgrep

    - name: Check
      run: make check-ci
