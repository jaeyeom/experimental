name: Go Test

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'codelab/flutter/**'
      - 'my-ts-project/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'codelab/flutter/**'
      - 'my-ts-project/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        # make check-gitleaks scans every commit, as it does locally. The
        # full history is small and the scan takes about a second, so
        # coverage wins over a PR-range scan.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: "1.26.10"
        cache: true

    - name: Set up Bazel
      uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3.0.0

    - name: Set up Emacs
      uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
      with:
        version: 29.4

    - name: Install Pkl
      uses: ./.github/actions/setup-pkl

    - name: Install shellcheck
      run: |
        set -eu
        # GitHub-hosted ubuntu runners ship a Google Chrome apt source that
        # periodically hash-mismatches and fails apt-get update. Same
        # workaround as bazel-test.yml.
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
          /etc/apt/sources.list.d/google-chrome.sources
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Install uv, ruff, mypy, and semgrep
      run: |
        set -eu
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT INT TERM
        curl -LsSf -o "$tmp" https://astral.sh/uv/install.sh
        sh "$tmp"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        PATH="$HOME/.local/bin:$PATH"
        export PATH
        uv tool install ruff
        uv tool install mypy
        uv tool install semgrep

    - name: Install goimports
      run: |
        set -eu
        version=$(awk '$1 == "golang.org/x/tools" { print $2; exit }' go.mod)
        test -n "$version"
        go install "golang.org/x/tools/cmd/goimports@${version}"

    - name: Install golangci-lint
      run: |
        set -eu
        version=v2.15.0
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT INT TERM
        gobin=$(go env GOPATH)/bin
        curl -sSfL -o "$tmp" "https://raw.githubusercontent.com/golangci/golangci-lint/${version}/install.sh"
        sh "$tmp" -b "$gobin" "$version"
        echo "$gobin" >> "$GITHUB_PATH"
        PATH="$gobin:$PATH"
        export PATH
        golangci-lint config verify

    - name: Install gitleaks
      run: |
        set -eu
        version=8.30.1
        sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        tarball="gitleaks_${version}_linux_x64.tar.gz"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT INT TERM
        curl -sSfL -o "$tmp/$tarball" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
        echo "${sha256}  $tmp/$tarball" | sha256sum -c -
        tar -xzf "$tmp/$tarball" -C "$tmp" gitleaks
        bindir="$HOME/.local/bin"
        mkdir -p "$bindir"
        install -m 0755 "$tmp/gitleaks" "$bindir/gitleaks"
        echo "$bindir" >> "$GITHUB_PATH"
        "$bindir/gitleaks" version

    - name: Check
      run: make check
