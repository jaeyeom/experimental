# Example factory config (docs/design.md §9). Copy to ./factory.toml
# or $XDG_CONFIG_HOME/factory/factory.toml and replace the placeholders.

# gh_bin = "gh-throttle" # gh binary for every call; else $GH_BIN; else "gh".
# A top-level key, so it goes before the first [table].

[defaults]
max_in_flight      = 3
min_start_interval = "10m"
full_sync_every    = "24h"
exclude_labels     = ["needs-human", "blocked-external"]
skip_types         = ["Epic"]
agent_kind         = "claude"
# agent_args       = ["--model", "opus"] # after -- on herdr agent start
dry_run            = true # tick/start need --apply unless false
# caller           = "coordinator" # {caller}; else the herdr pane id from startup
# start_prompt_append = [
#   "Send questions to your coordinator ({report_back}) instead of asking the user directly.",
# ]
# wake_before_prompt = "auto" # or "off"; auto runs agentbus wake --if-hibernated before the prompt
# agent_busy_timeout  = "20s" # retry herdr agent start while the new pane shell is busy
# agent_ready_timeout = "60s" # wait for the new agent to be idle before the prompt
# agent_ready_settle  = "1s"  # pause after that idle

# [sync]
# max_age = "15m" # 0, the default, never auto-syncs. A source max_age overrides this.
# next, show, priorities, and doctor sync a source older than max_age, then answer.
# --no-sync skips that refresh. A failed refresh warns and still answers.

# [[agent_rule]]
# name = "cheap" # optional; claims and factory stats show it, else the first label
# labels = ["mechanical"] # any-of; first match replaces agent_args
# agent_args = ["--model", "sonnet"]

# [gate]
# ignore_panes = [] # pane ids the start gate skips
# ignore_tabs  = [] # tab labels the start gate skips, such as a coordinator tab
# base_branch = "main" # unset = no branch check
# require = "on_base"  # or "clean_against_base"
# hold_files = ["~/.local/state/factory/hold"] # empty = that default path
# hold_tabs = [] # tab labels that hold until missing or done
# hold_ttl = "12h" # unset = no age check; a stale hold still refuses

# [worker]
# spawner     = "agentbus" # "agentbus" (default), "subagent", or "herdr"
# agent       = "claude"   # coding agent (e.g. "agy", "claude", "codex", "grok"); do not set alongside defaults.agent_kind
# agent_args  = ["--model", "opus"] # passed to the coding agent; may also go in [source.worker] or [lane.worker]
# max_workers = 1          # parallel running workers cap, orthogonal to spawner and max_in_flight; may also go in [source.worker]
# worktree    = false      # isolate each worker in a git worktree; may also go in [source.worker] or [lane.worker]

# [lease]
# gate      = "auto"  # agentbus workdir lease in the gate: auto (default), off, or required; top level only
# mode      = "off"   # start prompt lease rule: off (default), prompt, or prompt+check
# claim_for = "45m"   # --for in the rule; mode, claim_for, and restore may also go in [source.lease] or [lane.lease]
# restore   = false   # include agentbus lease restore alongside claim (requires mode = "prompt" or "prompt+check")

# [output]
# mode = "pr" # "pr" (default: create pull request) or "merge" (rebase onto base and push linear history); may also go in [source.output] or [lane.output]

# [claim]
# # Safety checks on factory start (closed/done items are always refused):
# require_leaf       = true               # refuse skip_types and items with open children
# require_unblocked  = true               # refuse items with open BlockedBy blockers
# source_containment = true               # enforce FACTORY_ITEM_SOURCE and current git repo scope
# # Ownership (Jira: assign Me; GitHub: assign @me):
# assign             = true               # take assignee ownership on claim (default true on Jira & GitHub)
# ownership_rule     = "unassigned_or_me" # "unassigned_or_me" (default), "unassigned", or "any"
# # Mark in-progress (Jira: claim_status transition; GitHub: native claim_status "In progress" by default, or legacy claim_label):
# mark_in_progress   = true               # mark issue in-progress on claim (default true); false allows empty status/label
# in_progress_rule   = "block"            # "block" (default: refuse if already in-progress by another) or "allow"
# create_label       = false              # GitHub: create claim label if missing
# # Claim comment (/gh-issue-resolver format, works on GitHub and Jira):
# comment            = true               # post claim comment on start (default true)
# nickname           = ""                 # optional machine nickname: [a-z0-9][a-z0-9-]{0,31}
# comment_template   = ""                 # placeholders: {agent}, {nickname}, {timestamp}, {id}, {source}
# # Per-source overrides go in [source.claim], which may also set status, transition (Jira), and label (GitHub/Jira).

[[source]]
name             = "acme"
kind             = "jira"
site             = "https://example.atlassian.net"
email            = "you@example.com"
token_file       = "~/.config/factory/jira-token"
jql              = "project = PRJ"
ready_statuses   = ["To Do", "Backlog"]
claim_status     = "In Progress"
# claim_transition is unset by default. It is a transition id or name,
# used when more than one transition lands in claim_status and no single
# transition is named claim_status. A value that does not land there errors.
# claim_transition = "start work"
claim_assign     = true
# create_assignee = "me" # `factory file` assigns the new issue to you; "unassigned" to skip
require_labels   = ["agent-ready"]
blocks_link_type = "Blocks"
parent_priority  = ["PRJ-2131", "PRJ-538", "PRJ-2435"]
# parent_blocks_child is "ignore" (default) or "honor".
# ignore does not let an ancestor's blocks link gate its descendant
# or count toward that ancestor's unblock score. Both modes warn.
# parent_blocks_child = "ignore"
# rank_order permutes parent_rank, unblocks, priority, and created.
# Unset keeps priority, unblocks, parent_rank, created.
# rank_order = ["parent_rank", "unblocks", "priority", "created"]
# priority_ranks overrides Highest=0, High=1, Medium=2, Low=3, Lowest=4.
# priority_ranks = { Highest = 0, High = 1 }
# known_priorities stay at rank 2 and do not warn.
# known_priorities = ["Untriaged"]
pr_title_pattern = '\[{id}\]'
cwd              = "~/src/yourrepo"
base             = "main"
workspace        = "factory"
start_prompt     = "@~/src/yourrepo/start.txt"
# defer_field    = "customfield_12345" # not-before date; the item waits until then
default_parent   = "PRJ-2436" # `factory file` without --parent
# Under a standard (non-epic) parent, `factory file` uses the project's single
# subtask issue type. Set this when the project has more than one.
# create_subtask_issue_type = "Sub-task"

  [[source.workspace_rule]]
  parent    = "PRJ-2131"
  workspace = "smoke"

  [[source.workspace_rule]]
  label     = "clang-tidy"
  workspace = "clang-tidy"

[[source]]
name           = "experimental"
kind           = "github"
repo           = "you/yourrepo"
cwd            = "~/src/yourrepo"
base           = "main"
require_labels = ["agent-ready"]
# Native GitHub issue statuses and starter fields are used by default:
# claim_status = "In progress", ready_statuses = ["Todo", "Backlog", "OPEN"] (release -> "Todo"),
# priority_field = "Priority", defer_field = "Start date", due_field = "Target date".
# Set claim_label / priority_labels / defer_label_prefix only on legacy repos.
start_prompt   = "/gh-issue-resolver {url} Do not run factory file, link, or release on a remote lane. When done, report back: {report_back}"
# defer_label_prefix = "not-before:" # label not-before:YYYY-MM-DD defers the issue
# workspace defaults to the repo name: "yourrepo"

  # [source.trust]
  # environment = "untrusted"            # "trusted" (default off) or "untrusted" (public repo)
  # trusted_author_associations = ["OWNER"] # plus authenticated me; MEMBER/COLLABORATOR not trusted by default
  # trusted_authors = []                 # optional login allowlist
  # untrusted_ready_statuses = ["Todo"]  # [] blocks all untrusted-author issues
  # guards = ["locked"]                  # tamper guards: "locked", "approved_hash", or [] to disable
