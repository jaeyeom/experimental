# One Jira project in a shared monorepo checkout.
# Copy into ./factory.toml or ~/.config/factory/factory.toml.
# token_file must be mode 0600. A leading ~/ is expanded; chmod 600 the file.
# dry_run defaults to true, so start and tick only print a plan until --apply.
# The first matching workspace_rule wins. Otherwise the workspace is "factory".

# [defaults]
# start_prompt_append = [
#   "Send questions to your coordinator ({report_back}) instead of asking the user directly.",
# ]

[[source]]
name             = "monorepo"
kind             = "jira"
site             = "https://example.atlassian.net"
email            = "you@example.com"
token_file       = "~/.config/factory/jira-token"
jql              = "project = PRJ"
ready_statuses   = ["To Do", "Backlog"]
claim_status     = "In Progress"
# claim_transition is unset by default. It is a transition id or name,
# used when more than one transition lands in claim_status and no single
# transition is named claim_status. A value that does not land there errors.
# claim_transition = "start work"
claim_assign     = true
require_labels   = ["agent-ready"]
blocks_link_type = "Blocks"
# priority_ranks overrides Highest=0 .. Lowest=4. known_priorities stay at 2.
# priority_ranks = { Highest = 0 }
# known_priorities = ["Untriaged"]
cwd              = "~/src/monorepo"
base             = "main"
workspace        = "factory"
start_prompt     = """
Before anything else: run `git fetch origin` and create a fresh branch from
origin/{base} for this work. Other agents share this checkout, and their
branches must be left as they are.
/implement-jira-ticket {id}
"""

  [[source.workspace_rule]]
  parent    = "PRJ-2131"
  workspace = "smoke"

  [[source.workspace_rule]]
  label     = "clang-tidy"
  workspace = "clang-tidy"
