# One GitHub repo. workspace is omitted on purpose: it defaults to the
# repo name ("yourrepo"), not the source name. See docs/usage.md.

# [defaults]
# start_prompt_append = [
#   "Send questions to your coordinator ({report_back}) instead of asking the user directly.",
# ]

[[source]]
name           = "issues"
kind           = "github"
repo           = "you/yourrepo"
cwd            = "~/src/yourrepo"
base           = "main"
require_labels = ["agent-ready"]
# Native GitHub issue statuses and starter fields are used by default:
# ready_statuses = ["Todo", "Backlog", "OPEN"]
# claim_status   = "In progress"
# priority_field = "Priority"     # Urgent=0, High=1, Medium=2, Low=3
# defer_field    = "Start date"   # not-before deferral date
# due_field      = "Target date"  # due date (falls back to milestone.dueOn)
# Set claim_label / priority_labels / defer_label_prefix only on legacy repos.
start_prompt   = "/gh-issue-resolver {url}"
