- import_playbook: setup-user-bin-directory.yml
  when: ansible_facts['env']['TERMUX_VERSION'] is not defined and ansible_facts['os_family'] != "Darwin"

- name: Ensure circleci is present
  hosts: all
  tasks:
    - name: Include guard for circleci playbook
      block:
        - name: Stop early if the circleci playbook is already included
          meta: end_play
          when: circleci_playbook_imported is defined
        - name: Ensure the circleci playbook is not included
          set_fact:
            circleci_playbook_imported: true
          when: circleci_playbook_imported is not defined

    - name: Ensure circleci is present on MacOS
      block:
        - name: Check if circleci is installed
          shell: command -v circleci
          changed_when: False
      rescue:
        - name: Install circleci on MacOS
          community.general.homebrew:
            name: circleci
            state: present
      when: ansible_facts['os_family'] == "Darwin"

    - name: Install circleci via shell on Debian/Ubuntu
      block:
        - name: Check if circleci is installed
          shell: command -v circleci
          register: circleci_command_check
          failed_when: false
          changed_when: False
          environment:
            PATH: "{{ user_bin_directory }}:{{ ansible_facts['env']['PATH'] }}"

        - name: Get installed circleci version
          command: circleci version
          register: circleci_version_output
          failed_when: false
          changed_when: False
          when: circleci_command_check.rc == 0
          environment:
            PATH: "{{ user_bin_directory }}:{{ ansible_facts['env']['PATH'] }}"

        - name: Parse installed circleci version
          set_fact:
            circleci_installed_version: "{{ (circleci_version_output.stdout | regex_search('([0-9.]+)', '\\1')) | default(['0.0.0'], true) | first }}"
          when: circleci_command_check.rc == 0

        - name: Set default version when circleci is not installed
          set_fact:
            circleci_installed_version: "0.0.0"
          when: circleci_command_check.rc != 0

        - name: Get latest available circleci version from GitHub
          ansible.builtin.include_tasks: tasks/github-release-info.yml
          vars:
            github_release_name: circleci
            github_release_owner: CircleCI-Public
            github_release_repo: circleci-cli
            github_release_register: circleci_latest_release

        - name: Parse latest circleci version from GitHub response
          set_fact:
            circleci_latest_version: "{{ circleci_latest_release.json.tag_name | regex_replace('^v', '') }}"

        - name: Install/update circleci if outdated
          shell: |
            DESTDIR={{ user_bin_directory }} {{ playbook_dir }}/verified-run exec https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/main/install.sh
          when: circleci_installed_version != circleci_latest_version
          environment:
            PATH: "{{ user_bin_directory }}:{{ ansible_facts['env']['PATH'] }}"
      when: ansible_facts['env']['TERMUX_VERSION'] is not defined and ansible_facts['os_family'] != "Darwin"
