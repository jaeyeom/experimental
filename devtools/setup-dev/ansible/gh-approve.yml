- import_playbook: gh.yml
- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure gh-approve is present
  hosts: all
  # The first file found is loaded. /dev/null keeps a missing vars file
  # from failing the play.
  vars_files:
    - - "{{ (lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or (lookup('ansible.builtin.env', 'HOME') ~ '/.config')) ~ '/setup-dev/vars.yml' }}"
      - /dev/null
  tasks:
    - name: Include guard for gh-approve playbook
      block:
        - name: Stop early if the gh-approve playbook is already included
          meta: end_play
          when: gh_approve_playbook_imported is defined
        - name: Ensure the gh-approve playbook is not included
          set_fact:
            gh_approve_playbook_imported: true
          when: gh_approve_playbook_imported is not defined

    - name: Check if gh-approve is installed
      shell: go version -m $(command -v gh-approve) | grep '^\s*mod\s'
      register: gh_approve_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract gh-approve version
      block:
        - name: Set gh-approve facts
          set_fact:
            gh_approve_module_path: "{{ gh_approve_installed.stdout.split()[1] }}"
            gh_approve_module_version: "{{ gh_approve_installed.stdout.split()[2] }}"
        - name: Determine the latest gh-approve version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "github.com/chorong-sh/chorong@{{ chorong_ref | default('latest') }}"
          register: gh_approve_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            gh_approve_module_path | length > 0 and
            (gh_approve_module_path == 'github.com/chorong-sh/chorong' or
            'github.com/chorong-sh/chorong'.startswith(gh_approve_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ gh_approve_module_path }} {{ gh_approve_module_version }} => {{ ((gh_approve_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear gh-approve facts
          set_fact:
            gh_approve_module_path: ""
            gh_approve_module_version: ""

    - name: Get gh-approve build Go version
      shell: go version -m $(command -v gh-approve) 2>/dev/null | head -1 | awk '{print $2}'
      register: gh_approve_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare gh-approve installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ gh_approve_module_version | default('') }}"
          - "{{ ((gh_approve_latest | default({})).stdout | default('')) | trim }}"
          - "{{ gh_approve_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ gh_approve_module_path | default('') | trim }}"
          - --target-module
          - github.com/chorong-sh/chorong
      register: gh_approve_version_check
      changed_when: false
      check_mode: false

    - name: Skip gh-approve upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping gh-approve: {{ (gh_approve_version_check.stdout | from_json).reason }}"
      when: (gh_approve_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade gh-approve
      command: go install github.com/chorong-sh/chorong/gh-nudge/cmd/gh-approve@{{ chorong_ref | default('latest') }}
      register: gh_approve_upgrade
      until: gh_approve_upgrade is succeeded
      retries: 3
      delay: 30
      when: (gh_approve_version_check.stdout | from_json).action == 'install'
