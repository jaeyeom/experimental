- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure godef is present
  hosts: all
  tasks:
    - name: Include guard for godef playbook
      block:
        - name: Stop early if the godef playbook is already included
          meta: end_play
          when: godef_playbook_imported is defined
        - name: Ensure the godef playbook is not included
          set_fact:
            godef_playbook_imported: true
          when: godef_playbook_imported is not defined

    - name: Check if godef is installed
      shell: go version -m $(command -v godef) | grep '^\s*mod\s'
      register: godef_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract godef version
      block:
        - name: Set godef facts
          set_fact:
            godef_module_path: "{{ godef_installed.stdout.split()[1] }}"
            godef_module_version: "{{ godef_installed.stdout.split()[2] }}"
        - name: Determine the latest godef version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ godef_module_path }}@latest"
          register: godef_latest
          ignore_errors: yes
          changed_when: False

        - name: Debug module path and version
          debug:
            msg: "{{ godef_module_path }} {{ godef_module_version }} => {{ godef_latest.stdout }}"
      rescue:
        - name: Clear godef facts
          set_fact:
            godef_module_path: ""
            godef_module_version: ""

    - name: Get godef build Go version
      shell: go version -m $(command -v godef) 2>/dev/null | head -1 | awk '{print $2}'
      register: godef_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare godef installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ godef_module_version | default('') }}"
          - "{{ ((godef_latest | default({})).stdout | default('')) | trim }}"
          - "{{ godef_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
      register: godef_version_check
      changed_when: false
      check_mode: false

    - name: Skip godef upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping godef: {{ (godef_version_check.stdout | from_json).reason }}"
      when: (godef_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade godef
      command: go install github.com/rogpeppe/godef@latest
      register: godef_upgrade
      until: godef_upgrade is succeeded
      retries: 3
      delay: 30
      when: (godef_version_check.stdout | from_json).action == 'install'
