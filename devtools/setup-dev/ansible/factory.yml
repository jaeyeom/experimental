- import_playbook: gather-facts.yml
- import_playbook: gh.yml
- import_playbook: herdr.yml
  when: ansible_facts['env']['TERMUX_VERSION'] is not defined
- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure factory is present
  hosts: all
  tasks:
    - name: Include guard for factory playbook
      block:
        - name: Stop early if the factory playbook is already included
          meta: end_play
          when: factory_playbook_imported is defined
        - name: Ensure the factory playbook is not included
          set_fact:
            factory_playbook_imported: true
          when: factory_playbook_imported is not defined

    - name: Check if factory is installed
      shell: go version -m $(command -v factory) | grep '^\s*mod\s'
      register: factory_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract factory version
      block:
        - name: Set factory facts
          set_fact:
            factory_module_path: "{{ factory_installed.stdout.split()[1] }}"
            factory_module_version: "{{ factory_installed.stdout.split()[2] }}"
        - name: Determine the latest factory version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ factory_module_path }}@latest"
          environment:
            GOPRIVATE: github.com/jaeyeom/agentic-factory
            GONOSUMDB: github.com/jaeyeom/agentic-factory
            GIT_CONFIG_COUNT: "2"
            GIT_CONFIG_KEY_0: credential.https://github.com.helper
            GIT_CONFIG_VALUE_0: ""
            GIT_CONFIG_KEY_1: credential.https://github.com.helper
            GIT_CONFIG_VALUE_1: "!gh auth git-credential"
          register: factory_latest
          ignore_errors: yes
          changed_when: False

        - name: Debug module path and version
          debug:
            msg: "{{ factory_module_path }} {{ factory_module_version }} => {{ factory_latest.stdout }}"
      rescue:
        - name: Clear factory facts
          set_fact:
            factory_module_path: ""
            factory_module_version: ""

    - name: Get factory build Go version
      shell: go version -m $(command -v factory) 2>/dev/null | head -1 | awk '{print $2}'
      register: factory_build_go
      ignore_errors: yes
      changed_when: false

    - name: Upgrade factory
      command: go install github.com/jaeyeom/agentic-factory/cmd/factory@latest
      environment:
        GOPRIVATE: github.com/jaeyeom/agentic-factory
        GONOSUMDB: github.com/jaeyeom/agentic-factory
        GIT_CONFIG_COUNT: "2"
        GIT_CONFIG_KEY_0: credential.https://github.com.helper
        GIT_CONFIG_VALUE_0: ""
        GIT_CONFIG_KEY_1: credential.https://github.com.helper
        GIT_CONFIG_VALUE_1: "!gh auth git-credential"
      register: factory_upgrade
      until: factory_upgrade is succeeded
      retries: 3
      delay: 30
      when: >
        factory_module_version is not defined or
        factory_module_version == "" or
        factory_module_version != factory_latest.stdout or
        factory_build_go.stdout | default('') != go_toolchain_version
