- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure decide is present
  hosts: all
  # The first file found is loaded. /dev/null keeps a missing vars file
  # from failing the play.
  vars_files:
    - - "{{ (lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or (lookup('ansible.builtin.env', 'HOME') ~ '/.config')) ~ '/setup-dev/vars.yml' }}"
      - /dev/null
  tasks:
    - name: Include guard for decide playbook
      block:
        - name: Stop early if the decide playbook is already included
          meta: end_play
          when: decide_playbook_imported is defined
        - name: Ensure the decide playbook is not included
          set_fact:
            decide_playbook_imported: true
          when: decide_playbook_imported is not defined

    - name: Check if decide is installed
      shell: go version -m $(command -v decide) | grep '^\s*mod\s'
      register: decide_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract decide version
      block:
        - name: Set decide facts
          set_fact:
            decide_module_path: "{{ decide_installed.stdout.split()[1] }}"
            decide_module_version: "{{ decide_installed.stdout.split()[2] }}"
        - name: Determine the latest decide version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "github.com/jaeyeom/experimental@{{ experimental_ref | default('main') }}"
          register: decide_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            decide_module_path | length > 0 and
            (decide_module_path == 'github.com/jaeyeom/experimental' or
            'github.com/jaeyeom/experimental'.startswith(decide_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ decide_module_path }} {{ decide_module_version }} => {{ ((decide_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear decide facts
          set_fact:
            decide_module_path: ""
            decide_module_version: ""

    - name: Get decide build Go version
      shell: go version -m $(command -v decide) 2>/dev/null | head -1 | awk '{print $2}'
      register: decide_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare decide installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ decide_module_version | default('') }}"
          - "{{ ((decide_latest | default({})).stdout | default('')) | trim }}"
          - "{{ decide_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ decide_module_path | default('') | trim }}"
          - --target-module
          - github.com/jaeyeom/experimental
      register: decide_version_check
      changed_when: false
      check_mode: false

    - name: Skip decide upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping decide: {{ (decide_version_check.stdout | from_json).reason }}"
      when: (decide_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade decide
      command: go install github.com/jaeyeom/experimental/devtools/decide/cmd/decide@{{ experimental_ref | default('main') }}
      register: decide_upgrade
      until: decide_upgrade is succeeded
      retries: 3
      delay: 30
      when: (decide_version_check.stdout | from_json).action == 'install'
