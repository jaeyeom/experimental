- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure decide is present
  hosts: all
  tasks:
    - name: Include guard for decide playbook
      block:
        - name: Stop early if the decide playbook is already included
          meta: end_play
          when: decide_playbook_imported is defined
        - name: Ensure the decide playbook is not included
          set_fact:
            decide_playbook_imported: true
          when: decide_playbook_imported is not defined

    - name: Check if decide is installed
      shell: go version -m $(command -v decide) | grep '^\s*mod\s'
      register: decide_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract decide version
      block:
        - name: Set decide facts
          set_fact:
            decide_module_path: "{{ decide_installed.stdout.split()[1] }}"
            decide_module_version: "{{ decide_installed.stdout.split()[2] }}"
        - name: Determine the latest decide version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ decide_module_path }}@latest"
          register: decide_latest
          ignore_errors: yes
          changed_when: False

        - name: Debug module path and version
          debug:
            msg: "{{ decide_module_path }} {{ decide_module_version }} => {{ decide_latest.stdout }}"
      rescue:
        - name: Clear decide facts
          set_fact:
            decide_module_path: ""
            decide_module_version: ""

    - name: Get decide build Go version
      shell: go version -m $(command -v decide) 2>/dev/null | head -1 | awk '{print $2}'
      register: decide_build_go
      ignore_errors: yes
      changed_when: false

    - name: Upgrade decide
      command: go install github.com/jaeyeom/experimental/devtools/decide/cmd/decide@latest
      register: decide_upgrade
      until: decide_upgrade is succeeded
      retries: 3
      delay: 30
      when: >
        decide_module_version is not defined or
        decide_module_version == "" or
        decide_module_version != decide_latest.stdout or
        decide_build_go.stdout | default('') != go_toolchain_version
