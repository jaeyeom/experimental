---
# Two-machine hub setup, client side (jaeyeom/experimental#683).
#
# Installs agentbus and decide, and points both at the hub:
#
#   - ~/.config/decide/config.json: hub, hubTimeout, machine, merged into
#     the existing JSON;
#   - ~/.config/agentbus/config.toml: top-level hub, machine,
#     remote_timeout, above the first [section].
#
# Both files are backed up (file.<pid>.<date>@<time>~) before a change.
# Nothing else by default: no `agentbus install`, service, tunnel, or
# token. agentbusd is not installed, because it refuses to start in hub
# mode.
#
# hub_ssh_stable_agent (default false) opts in to a stable ssh-agent
# socket. The tunnel unit does not inherit SSH_AUTH_SOCK. When true:
#   - a marked block at the end of the file that starts the agent
#     relinks ~/.ssh/agent.sock. zsh reads ~/.zprofile before
#     ~/.zshrc, so the block must come after the agent-start line
#     (keychain, ssh-agent, eval "$(ssh-agent, or SSH_AUTH_SOCK=).
#     When hub_ssh_agent_rc is unset, that file is the one with the
#     last such line, including a file it sources one level deep.
#     If none is found, the file is ~/.zprofile if it exists, else
#     ~/.bash_profile, else ~/.profile. When hub_ssh_agent_rc is set
#     and the agent starts in a file that runs later, the play warns
#     and names both files. It does not move the block. Keep the
#     block after the agent-start line if you move it;
#   - ssh_identity_agent = "~/.ssh/agent.sock" is set in the agentbus
#     config, beside hub;
#   - when the tunnel unit is already installed and that key changed,
#     the play prints `agentbus install` for you to run. It rewrites
#     the unit and restarts it. This playbook never runs it, and it
#     does not edit ~/.ssh/config.
#
# Variables (inventory, group vars, the per-machine vars file
# ${XDG_CONFIG_HOME:-~/.config}/setup-dev/vars.yml, or -e):
#
#   hub_ssh_target        required, the ssh target of the hub
#   client_machine_label  required, this machine's herdr saved-machine
#                         label on the hub
#   hub_tools_version     go install version: a tag, a commit, or latest
#                         (default latest)
#   hub_connect_timeout   ssh connect timeout (default 5s)
#   hub_ssh_stable_agent  opt in to the stable agent socket (default false)
#   hub_ssh_agent_rc      login rc for that block. Unset: the file
#                         with the last agent-start line, else the
#                         default above. zsh reads .zprofile first.
#
#   ansible-playbook -i inventory.ini setup-hub-client.yml \
#     -e hub_ssh_target=me@hub.example -e client_machine_label=laptop
#
# The last task (tag hub-check) runs `decide status list` and
# `agentbus list` through the hub. `--tags hub-check` runs only the check;
# `--tags hub-config` only writes the two files. `--tags hub-ssh-agent`
# writes the stable agent socket when hub_ssh_stable_agent is true.
# hub_setup_test.sh runs these with a temp HOME.
- import_playbook: gather-facts.yml
- import_playbook: setup-user-go-bin-directory.yml

- name: Point agentbus and decide at the hub
  hosts: all
  # The first file found is loaded. /dev/null keeps a missing vars file
  # from failing the play.
  vars_files:
    - - "{{ (lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or (lookup('ansible.builtin.env', 'HOME') ~ '/.config')) ~ '/setup-dev/vars.yml' }}"
      - /dev/null
  # Defaults live in expressions, not play vars, so inventory and group
  # vars still set these variables.
  vars:
    hub_client_target: "{{ hub_ssh_target | default('') }}"
    hub_client_machine: "{{ client_machine_label | default('') }}"
    hub_client_version: "{{ hub_tools_version | default('latest') }}"
    hub_client_timeout: "{{ hub_connect_timeout | default('5s') }}"
    hub_client_stable_agent: "{{ hub_ssh_stable_agent | default(false) | bool }}"
    hub_client_agent_rc: "{{ hub_ssh_agent_rc | default('') }}"
    hub_client_home: "{{ ansible_facts['env']['HOME'] }}"
    hub_client_config_home: "{{ ansible_facts['env']['XDG_CONFIG_HOME'] | default(hub_client_home ~ '/.config', true) }}"
    hub_client_tunnel_units:
      - "{{ hub_client_home }}/Library/LaunchAgents/com.agentbus.tunnel.plist"
      - "{{ hub_client_config_home }}/systemd/user/agentbus-tunnel.service"
    hub_client_decide_config: "{{ hub_client_config_home }}/decide/config.json"
    hub_client_agentbus_config: "{{ hub_client_config_home }}/agentbus/config.toml"
    hub_client_module: github.com/jaeyeom/experimental
    hub_client_packages:
      - "{{ hub_client_module }}/devtools/agentbus/cmd/agentbus"
      - "{{ hub_client_module }}/devtools/decide/cmd/decide"
  tasks:
    - name: Include guard for setup-hub-client playbook
      block:
        - name: Stop early if the setup-hub-client playbook is already included
          meta: end_play
          when: setup_hub_client_playbook_imported is defined
        - name: Ensure the setup-hub-client playbook is not included
          set_fact:
            setup_hub_client_playbook_imported: true
          when: setup_hub_client_playbook_imported is not defined
      tags: always

    - name: Require the hub variables
      ansible.builtin.assert:
        that:
          - hub_client_target | length > 0
          - hub_client_machine | length > 0
        fail_msg: >-
          Set hub_ssh_target (the hub's ssh target) and client_machine_label
          (this machine's herdr saved-machine label on the hub), with -e or
          in ~/.config/setup-dev/vars.yml.
        quiet: true
      tags: always

    # A tag, a commit, or latest resolves to one module version (a commit
    # to its pseudo-version), so a binary already at it is left alone.
    - name: Resolve hub_tools_version to a module version
      ansible.builtin.command:
        argv: [go, list, -m, -f, "{{ '{{' }}.Version{{ '}}' }}", "{{ hub_client_module }}@{{ hub_client_version }}"]
      register: hub_client_resolved
      changed_when: false
      check_mode: false
      tags: hub-install

    - name: Read the installed agentbus and decide versions
      ansible.builtin.shell: >-
        go version -m "$(go env GOPATH)/bin/{{ item | basename }}" 2>/dev/null
        | awk '$1 == "mod" { print $3 }'
      loop: "{{ hub_client_packages }}"
      register: hub_client_installed
      changed_when: false
      failed_when: false
      check_mode: false
      tags: hub-install

    - name: Install agentbus and decide
      ansible.builtin.command: go install {{ item.item }}@{{ hub_client_resolved.stdout }}
      loop: "{{ hub_client_installed.results }}"
      loop_control:
        label: "{{ item.item | basename }}"
      when: item.stdout != hub_client_resolved.stdout
      register: hub_client_install
      until: hub_client_install is succeeded
      retries: 3
      delay: 30
      tags: hub-install

    - name: Read the decide config
      ansible.builtin.slurp:
        src: "{{ hub_client_decide_config }}"
      register: hub_client_decide_current
      failed_when: false
      tags: hub-config

    - name: Create the config directories
      ansible.builtin.file:
        path: "{{ item | dirname }}"
        state: directory
      loop:
        - "{{ hub_client_decide_config }}"
        - "{{ hub_client_agentbus_config }}"
      tags: hub-config

    - name: Merge hub, hubTimeout, and machine into the decide config
      ansible.builtin.copy:
        dest: "{{ hub_client_decide_config }}"
        backup: true
        mode: "0600"
        content: |
          {{ ((hub_client_decide_current.content | default('') | b64decode | trim or '{}') | from_json)
             | combine({'hub': hub_client_target, 'hubTimeout': hub_client_timeout, 'machine': hub_client_machine})
             | to_nice_json(indent=2) }}
      tags: hub-config

    # Without a section, ini_file keeps the keys above the first [section].
    - name: Set hub, machine, and remote_timeout in the agentbus config
      community.general.ini_file:
        path: "{{ hub_client_agentbus_config }}"
        option: "{{ item.key }}"
        value: "{{ item.value | to_json }}"
        modify_inactive_option: false
        backup: true
        mode: "0600"
      loop:
        - {key: hub, value: "{{ hub_client_target }}"}
        - {key: machine, value: "{{ hub_client_machine }}"}
        - {key: remote_timeout, value: "{{ hub_client_timeout }}"}
      loop_control:
        label: "{{ item.key }}"
      tags: hub-config

    - name: Find the shell file that starts the agent
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/hub_ssh_agent_scan.py"
          - "{{ hub_client_home }}"
          - "{{ hub_client_agent_rc }}"
      register: hub_client_agent_scan
      changed_when: false
      check_mode: false
      when: hub_client_stable_agent | bool
      tags: hub-ssh-agent

    - name: Record the login rc for the stable agent socket
      ansible.builtin.set_fact:
        hub_client_agent_rc_path: "{{ (hub_client_agent_scan.stdout | from_json).rc }}"
        hub_client_agent_warn: "{{ (hub_client_agent_scan.stdout | from_json).warn }}"
      when: hub_client_stable_agent | bool
      tags: hub-ssh-agent

    - name: Warn when the agent starts after the chosen rc
      ansible.builtin.debug:
        msg: >-
          hub_ssh_agent_rc {{ hub_client_agent_rc_path }} runs before the
          agent starts in {{ hub_client_agent_warn }}. zsh reads
          ~/.zprofile before ~/.zshrc. The block stays where you asked;
          move it to after the agent-start line, or unset hub_ssh_agent_rc.
      when:
        - hub_client_stable_agent | bool
        - hub_client_agent_warn | default('') | length > 0
      tags: hub-ssh-agent

    - name: Keep ~/.ssh/agent.sock pointed at the login agent
      ansible.builtin.blockinfile:
        path: "{{ hub_client_agent_rc_path }}"
        marker: "# {mark} setup-dev hub ssh agent (setup-hub-client.yml)"
        create: true
        backup: true
        block: |
          if [ -n "$SSH_AUTH_SOCK" ] && [ -S "$SSH_AUTH_SOCK" ] && [ "$SSH_AUTH_SOCK" != "$HOME/.ssh/agent.sock" ]; then
            ln -sf "$SSH_AUTH_SOCK" "$HOME/.ssh/agent.sock"
          fi
      when: hub_client_stable_agent | bool
      tags: hub-ssh-agent

    - name: Create the agentbus config directory
      ansible.builtin.file:
        path: "{{ hub_client_agentbus_config | dirname }}"
        state: directory
      when: hub_client_stable_agent | bool
      tags: hub-ssh-agent

    - name: Set ssh_identity_agent in the agentbus config
      community.general.ini_file:
        path: "{{ hub_client_agentbus_config }}"
        option: ssh_identity_agent
        value: "{{ '~/.ssh/agent.sock' | to_json }}"
        modify_inactive_option: false
        backup: true
        mode: "0600"
      register: hub_client_identity_agent
      when: hub_client_stable_agent | bool
      tags: hub-ssh-agent

    - name: Stat the tunnel unit
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ hub_client_tunnel_units }}"
      register: hub_client_tunnel_unit
      when: hub_client_stable_agent | bool
      tags: hub-ssh-agent

    - name: Tell the user to re-run agentbus install
      ansible.builtin.debug:
        msg: "The tunnel unit is installed and ssh_identity_agent changed. Re-run `agentbus install` to rewrite the unit and restart it."
      when:
        - hub_client_stable_agent | bool
        - hub_client_identity_agent is changed
        - hub_client_tunnel_unit.results | default([]) | selectattr('stat.exists') | list | length > 0
      tags: hub-ssh-agent

    - name: Run decide and agentbus through the hub
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [decide, status, list]
        - [agentbus, list]
      loop_control:
        label: "{{ item | join(' ') }}"
      environment:
        DECIDE_HUB: "{{ hub_client_target }}"
        AGENTBUS_HUB: "{{ hub_client_target }}"
      register: hub_client_check
      changed_when: false
      check_mode: false
      failed_when: false
      tags: hub-check

    - name: Fail when the hub check failed
      ansible.builtin.fail:
        msg: "`{{ item.item | join(' ') }}` through {{ hub_client_target }} failed (exit {{ item.rc | default('?') }}): {{ item.stderr | default('', true) or item.msg | default('') }}"
      loop: "{{ hub_client_check.results }}"
      loop_control:
        label: "{{ item.item | join(' ') }}"
      when: item.rc | default(1) != 0
      tags: hub-check
