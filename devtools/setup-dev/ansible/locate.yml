- name: Ensure locate is present
  hosts: all
  tasks:
    - name: Include guard for locate playbook
      block:
        - name: Stop early if the locate playbook is already included
          meta: end_play
          when: locate_playbook_imported is defined
        - name: Ensure the locate playbook is not included
          set_fact:
            locate_playbook_imported: true
          when: locate_playbook_imported is not defined

    - name: Ensure locate is present on MacOS
      block:
        - name: Check if locate is installed
          shell: command -v locate
          changed_when: False
      rescue:
        - name: Install locate on MacOS
          community.general.homebrew:
            name: findutils
            state: present
      when: ansible_facts['os_family'] == "Darwin"

    - name: Ensure locate is present on non-Termux, non-MacOS systems
      block:
        - name: Check if locate is installed
          shell: command -v locate
          changed_when: False
      rescue:
        - name: Install locate on non-Termux, non-MacOS systems
          package:
            name: plocate
            state: present
          become: yes
      when: ansible_facts['env']['TERMUX_VERSION'] is not defined and ansible_facts['os_family'] != "Darwin"

    - name: Ensure locate is present on Termux
      block:
        - name: Check if locate is installed
          shell: command -v locate
          changed_when: False
      rescue:
        - name: Install locate on Termux
          command: pkg install -y mlocate
      when: ansible_facts['env']['TERMUX_VERSION'] is defined

    - name: Check locate database age on non-macOS systems
      stat:
        path: "{{ '/data/data/com.termux/files/usr/var/mlocate/mlocate.db' if ansible_facts['env']['TERMUX_VERSION'] is defined else '/var/lib/plocate/plocate.db' }}"
      register: locate_db_stat
      when: ansible_facts['os_family'] != "Darwin"

    - name: Ensure locate DB is up-to-date on non-Termux, non-macOS systems
      command:
        argv:
          - updatedb
          - --add-prunepaths
          - /mnt
          - --add-prunefs
          - 9p drvfs
      become: yes
      ignore_errors: true
      when:
        - ansible_facts['env']['TERMUX_VERSION'] is not defined and ansible_facts['os_family'] != "Darwin"
        - ((ansible_date_time.epoch | int) - (locate_db_stat.stat.mtime | default(0) | int)) >= (locate_updatedb_max_age_seconds | default(7 * 24 * 60 * 60) | int)

    - name: Ensure locate DB is up-to-date on Termux
      command: updatedb
      ignore_errors: true
      when:
        - ansible_facts['env']['TERMUX_VERSION'] is defined
        - ((ansible_date_time.epoch | int) - (locate_db_stat.stat.mtime | default(0) | int)) >= (locate_updatedb_max_age_seconds | default(7 * 24 * 60 * 60) | int)

    - name: Note about locate DB on macOS
      debug:
        msg: "On macOS, run 'sudo /usr/libexec/locate.updatedb' manually to update the locate database"
      when: ansible_facts['os_family'] == "Darwin"
