- name: Ensure gh is present
  hosts: all
  tasks:
    - name: Include guard for gh playbook
      block:
        - name: Stop early if the gh playbook is already included
          meta: end_play
          when: gh_playbook_imported is defined
        - name: Ensure the gh playbook is not included
          set_fact:
            gh_playbook_imported: true
          when: gh_playbook_imported is not defined

    - name: Ensure gh is present on MacOS
      block:
        - name: Check if gh is installed
          shell: command -v gh
          changed_when: False
      rescue:
        - name: Install gh on MacOS
          community.general.homebrew:
            name: gh
            state: present
      when: ansible_facts['os_family'] == "Darwin"

    - name: Ensure gh is present on non-Termux, non-MacOS systems
      block:
        - name: Check if gh is installed
          shell: command -v gh
          changed_when: False
      rescue:
        - name: Install gh on non-Termux, non-MacOS systems
          package:
            name: gh
            state: present
          become: yes
      when: ansible_facts['env']['TERMUX_VERSION'] is not defined and ansible_facts['os_family'] != "Darwin"

    - name: Ensure gh is present on Termux
      block:
        - name: Check if gh is installed
          shell: command -v gh
          changed_when: False
      rescue:
        - name: Install gh on Termux
          command: pkg install -y gh
      when: ansible_facts['env']['TERMUX_VERSION'] is defined

    - name: Ensure gh-stack extension is present
      when: ansible_facts['env']['TERMUX_VERSION'] is not defined
      block:
        - name: Check if gh-stack extension is installed
          shell: gh extension list | grep -q 'gh-stack'
          register: gh_stack_installed
          failed_when: false
          changed_when: False

        - name: Install gh-stack extension
          command: gh extension install github/gh-stack
          when: gh_stack_installed.rc != 0

        - name: Upgrade gh-stack extension
          command: gh extension upgrade gh-stack
          when: gh_stack_installed.rc == 0
