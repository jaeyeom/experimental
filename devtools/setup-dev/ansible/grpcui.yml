- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure grpcui is present
  hosts: all
  tasks:
    - name: Include guard for grpcui playbook
      block:
        - name: Stop early if the grpcui playbook is already included
          meta: end_play
          when: grpcui_playbook_imported is defined
        - name: Ensure the grpcui playbook is not included
          set_fact:
            grpcui_playbook_imported: true
          when: grpcui_playbook_imported is not defined

    - name: Check if grpcui is installed
      shell: go version -m $(command -v grpcui) | grep '^\s*mod\s'
      register: grpcui_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract grpcui version
      block:
        - name: Set grpcui facts
          set_fact:
            grpcui_module_path: "{{ grpcui_installed.stdout.split()[1] }}"
            grpcui_module_version: "{{ grpcui_installed.stdout.split()[2] }}"
        - name: Determine the latest grpcui version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ grpcui_module_path }}@latest"
          register: grpcui_latest
          ignore_errors: yes
          changed_when: False

        - name: Debug module path and version
          debug:
            msg: "{{ grpcui_module_path }} {{ grpcui_module_version }} => {{ grpcui_latest.stdout }}"
      rescue:
        - name: Clear grpcui facts
          set_fact:
            grpcui_module_path: ""
            grpcui_module_version: ""

    - name: Get grpcui build Go version
      shell: go version -m $(command -v grpcui) 2>/dev/null | head -1 | awk '{print $2}'
      register: grpcui_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare grpcui installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ grpcui_module_version | default('') }}"
          - "{{ ((grpcui_latest | default({})).stdout | default('')) | trim }}"
          - "{{ grpcui_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
      register: grpcui_version_check
      changed_when: false
      check_mode: false

    - name: Skip grpcui upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping grpcui: {{ (grpcui_version_check.stdout | from_json).reason }}"
      when: (grpcui_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade grpcui
      command: go install github.com/fullstorydev/grpcui/cmd/grpcui@latest
      register: grpcui_upgrade
      until: grpcui_upgrade is succeeded
      retries: 3
      delay: 30
      when: (grpcui_version_check.stdout | from_json).action == 'install'
