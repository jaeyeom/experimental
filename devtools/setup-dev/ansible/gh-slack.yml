# and then run: make
- import_playbook: gh.yml
- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure gh-slack is present
  hosts: all
  # The first file found is loaded. /dev/null keeps a missing vars file
  # from failing the play.
  vars_files:
    - - "{{ (lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or (lookup('ansible.builtin.env', 'HOME') ~ '/.config')) ~ '/setup-dev/vars.yml' }}"
      - /dev/null
  tasks:
    - name: Include guard for gh-slack playbook
      block:
        - name: Stop early if the gh-slack playbook is already included
          meta: end_play
          when: gh_slack_playbook_imported is defined
        - name: Ensure the gh-slack playbook is not included
          set_fact:
            gh_slack_playbook_imported: true
          when: gh_slack_playbook_imported is not defined

    - name: Check if gh-slack is installed
      shell: go version -m $(command -v gh-slack) | grep '^\s*mod\s'
      register: gh_slack_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract gh-slack version
      block:
        - name: Set gh-slack facts
          set_fact:
            gh_slack_module_path: "{{ gh_slack_installed.stdout.split()[1] }}"
            gh_slack_module_version: "{{ gh_slack_installed.stdout.split()[2] }}"
        - name: Determine the latest gh-slack version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "github.com/jaeyeom/experimental@{{ experimental_ref | default('main') }}"
          register: gh_slack_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            gh_slack_module_path | length > 0 and
            (gh_slack_module_path == 'github.com/jaeyeom/experimental' or
            'github.com/jaeyeom/experimental'.startswith(gh_slack_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ gh_slack_module_path }} {{ gh_slack_module_version }} => {{ ((gh_slack_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear gh-slack facts
          set_fact:
            gh_slack_module_path: ""
            gh_slack_module_version: ""

    - name: Get gh-slack build Go version
      shell: go version -m $(command -v gh-slack) 2>/dev/null | head -1 | awk '{print $2}'
      register: gh_slack_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare gh-slack installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ gh_slack_module_version | default('') }}"
          - "{{ ((gh_slack_latest | default({})).stdout | default('')) | trim }}"
          - "{{ gh_slack_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ gh_slack_module_path | default('') | trim }}"
          - --target-module
          - github.com/jaeyeom/experimental
      register: gh_slack_version_check
      changed_when: false
      check_mode: false

    - name: Skip gh-slack upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping gh-slack: {{ (gh_slack_version_check.stdout | from_json).reason }}"
      when: (gh_slack_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade gh-slack
      command: go install github.com/jaeyeom/experimental/devtools/gh-nudge/cmd/gh-slack@{{ experimental_ref | default('main') }}
      register: gh_slack_upgrade
      until: gh_slack_upgrade is succeeded
      retries: 3
      delay: 30
      when: (gh_slack_version_check.stdout | from_json).action == 'install'
