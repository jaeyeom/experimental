- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure healthsnap is present
  hosts: all
  # The first file found is loaded. /dev/null keeps a missing vars file
  # from failing the play.
  vars_files:
    - - "{{ (lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or (lookup('ansible.builtin.env', 'HOME') ~ '/.config')) ~ '/setup-dev/vars.yml' }}"
      - /dev/null
  tasks:
    - name: Include guard for healthsnap playbook
      block:
        - name: Stop early if the healthsnap playbook is already included
          meta: end_play
          when: healthsnap_playbook_imported is defined
        - name: Ensure the healthsnap playbook is not included
          set_fact:
            healthsnap_playbook_imported: true
          when: healthsnap_playbook_imported is not defined

    - name: Check if healthsnap is installed
      shell: go version -m $(command -v healthsnap) | grep '^\s*mod\s'
      register: healthsnap_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract healthsnap version
      block:
        - name: Set healthsnap facts
          set_fact:
            healthsnap_module_path: "{{ healthsnap_installed.stdout.split()[1] }}"
            healthsnap_module_version: "{{ healthsnap_installed.stdout.split()[2] }}"
        - name: Determine the latest healthsnap version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "github.com/jaeyeom/experimental@{{ experimental_ref | default('main') }}"
          register: healthsnap_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            healthsnap_module_path | length > 0 and
            (healthsnap_module_path == 'github.com/jaeyeom/experimental' or
            'github.com/jaeyeom/experimental'.startswith(healthsnap_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ healthsnap_module_path }} {{ healthsnap_module_version }} => {{ ((healthsnap_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear healthsnap facts
          set_fact:
            healthsnap_module_path: ""
            healthsnap_module_version: ""

    - name: Get healthsnap build Go version
      shell: go version -m $(command -v healthsnap) 2>/dev/null | head -1 | awk '{print $2}'
      register: healthsnap_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare healthsnap installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ healthsnap_module_version | default('') }}"
          - "{{ ((healthsnap_latest | default({})).stdout | default('')) | trim }}"
          - "{{ healthsnap_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ healthsnap_module_path | default('') | trim }}"
          - --target-module
          - github.com/jaeyeom/experimental
      register: healthsnap_version_check
      changed_when: false
      check_mode: false

    - name: Skip healthsnap upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping healthsnap: {{ (healthsnap_version_check.stdout | from_json).reason }}"
      when: (healthsnap_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade healthsnap
      command: go install github.com/jaeyeom/experimental/devtools/healthsnap/cmd/healthsnap@{{ experimental_ref | default('main') }}
      register: healthsnap_upgrade
      until: healthsnap_upgrade is succeeded
      retries: 3
      delay: 30
      when: (healthsnap_version_check.stdout | from_json).action == 'install'
