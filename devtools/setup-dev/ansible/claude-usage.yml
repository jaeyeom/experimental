- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure claude-usage is present
  hosts: all
  # The first file found is loaded. /dev/null keeps a missing vars file
  # from failing the play.
  vars_files:
    - - "{{ (lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or (lookup('ansible.builtin.env', 'HOME') ~ '/.config')) ~ '/setup-dev/vars.yml' }}"
      - /dev/null
  tasks:
    - name: Include guard for claude-usage playbook
      block:
        - name: Stop early if the claude-usage playbook is already included
          meta: end_play
          when: claude_usage_playbook_imported is defined
        - name: Ensure the claude-usage playbook is not included
          set_fact:
            claude_usage_playbook_imported: true
          when: claude_usage_playbook_imported is not defined

    - name: Check if claude-usage is installed
      shell: go version -m $(command -v claude-usage) | grep '^\s*mod\s'
      register: claude_usage_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract claude-usage version
      block:
        - name: Set claude-usage facts
          set_fact:
            claude_usage_module_path: "{{ claude_usage_installed.stdout.split()[1] }}"
            claude_usage_module_version: "{{ claude_usage_installed.stdout.split()[2] }}"
        - name: Determine the latest claude-usage version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "github.com/jaeyeom/experimental@{{ experimental_ref | default('main') }}"
          register: claude_usage_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            claude_usage_module_path | length > 0 and
            (claude_usage_module_path == 'github.com/jaeyeom/experimental' or
            'github.com/jaeyeom/experimental'.startswith(claude_usage_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ claude_usage_module_path }} {{ claude_usage_module_version }} => {{ ((claude_usage_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear claude-usage facts
          set_fact:
            claude_usage_module_path: ""
            claude_usage_module_version: ""

    - name: Get claude-usage build Go version
      shell: go version -m $(command -v claude-usage) 2>/dev/null | head -1 | awk '{print $2}'
      register: claude_usage_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare claude-usage installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ claude_usage_module_version | default('') }}"
          - "{{ ((claude_usage_latest | default({})).stdout | default('')) | trim }}"
          - "{{ claude_usage_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ claude_usage_module_path | default('') | trim }}"
          - --target-module
          - github.com/jaeyeom/experimental
      register: claude_usage_version_check
      changed_when: false
      check_mode: false

    - name: Skip claude-usage upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping claude-usage: {{ (claude_usage_version_check.stdout | from_json).reason }}"
      when: (claude_usage_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade claude-usage
      command: go install github.com/jaeyeom/experimental/devtools/claude-usage/cmd/claude-usage@{{ experimental_ref | default('main') }}
      register: claude_usage_upgrade
      until: claude_usage_upgrade is succeeded
      retries: 3
      delay: 30
      when: (claude_usage_version_check.stdout | from_json).action == 'install'
