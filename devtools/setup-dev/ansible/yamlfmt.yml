# and then run: make
- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure yamlfmt is present
  hosts: all
  tasks:
    - name: Include guard for yamlfmt playbook
      block:
        - name: Stop early if the yamlfmt playbook is already included
          meta: end_play
          when: yamlfmt_playbook_imported is defined
        - name: Ensure the yamlfmt playbook is not included
          set_fact:
            yamlfmt_playbook_imported: true
          when: yamlfmt_playbook_imported is not defined

    - name: Check if yamlfmt is installed
      shell: go version -m $(command -v yamlfmt) | grep '^\s*mod\s'
      register: yamlfmt_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract yamlfmt version
      block:
        - name: Set yamlfmt facts
          set_fact:
            yamlfmt_module_path: "{{ yamlfmt_installed.stdout.split()[1] }}"
            yamlfmt_module_version: "{{ yamlfmt_installed.stdout.split()[2] }}"
        - name: Determine the latest yamlfmt version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ yamlfmt_module_path }}@latest"
          register: yamlfmt_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            yamlfmt_module_path | length > 0 and
            (yamlfmt_module_path == 'github.com/google/yamlfmt/cmd/yamlfmt' or
            'github.com/google/yamlfmt/cmd/yamlfmt'.startswith(yamlfmt_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ yamlfmt_module_path }} {{ yamlfmt_module_version }} => {{ ((yamlfmt_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear yamlfmt facts
          set_fact:
            yamlfmt_module_path: ""
            yamlfmt_module_version: ""

    - name: Get yamlfmt build Go version
      shell: go version -m $(command -v yamlfmt) 2>/dev/null | head -1 | awk '{print $2}'
      register: yamlfmt_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare yamlfmt installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ yamlfmt_module_version | default('') }}"
          - "{{ ((yamlfmt_latest | default({})).stdout | default('')) | trim }}"
          - "{{ yamlfmt_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ yamlfmt_module_path | default('') | trim }}"
          - --target-module
          - github.com/google/yamlfmt/cmd/yamlfmt
      register: yamlfmt_version_check
      changed_when: false
      check_mode: false

    - name: Skip yamlfmt upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping yamlfmt: {{ (yamlfmt_version_check.stdout | from_json).reason }}"
      when: (yamlfmt_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade yamlfmt
      command: go install github.com/google/yamlfmt/cmd/yamlfmt@latest
      register: yamlfmt_upgrade
      until: yamlfmt_upgrade is succeeded
      retries: 3
      delay: 30
      when: (yamlfmt_version_check.stdout | from_json).action == 'install'
