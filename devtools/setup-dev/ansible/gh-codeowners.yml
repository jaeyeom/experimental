          set_fact:
            gh_codeowners_playbook_imported: true
          when: gh_codeowners_playbook_imported is not defined

    - name: Check if gh-codeowners is installed
      shell: go version -m $(command -v gh-codeowners) | grep '^\s*mod\s'
      register: gh_codeowners_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract gh-codeowners version
      block:
        - name: Set gh-codeowners facts
          set_fact:
            gh_codeowners_module_path: "{{ gh_codeowners_installed.stdout.split()[1] }}"
            gh_codeowners_module_version: "{{ gh_codeowners_installed.stdout.split()[2] }}"
        - name: Determine the latest gh-codeowners version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "github.com/jaeyeom/experimental@{{ experimental_ref | default('main') }}"
          register: gh_codeowners_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            gh_codeowners_module_path | length > 0 and
            (gh_codeowners_module_path == 'github.com/jaeyeom/experimental' or
            'github.com/jaeyeom/experimental'.startswith(gh_codeowners_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ gh_codeowners_module_path }} {{ gh_codeowners_module_version }} => {{ ((gh_codeowners_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear gh-codeowners facts
          set_fact:
            gh_codeowners_module_path: ""
            gh_codeowners_module_version: ""

    - name: Get gh-codeowners build Go version
      shell: go version -m $(command -v gh-codeowners) 2>/dev/null | head -1 | awk '{print $2}'
      register: gh_codeowners_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare gh-codeowners installed and target versions
      ansible.builtin.command:
        argv:
