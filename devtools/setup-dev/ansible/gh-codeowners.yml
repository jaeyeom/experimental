        msg: "Skipping gh-codeowners: {{ (gh_codeowners_version_check.stdout | from_json).reason }}"
      when: (gh_codeowners_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade gh-codeowners
