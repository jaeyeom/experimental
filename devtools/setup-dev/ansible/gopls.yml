- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure gopls is present
  hosts: all
  tasks:
    - name: Include guard for gopls playbook
      block:
        - name: Stop early if the gopls playbook is already included
          meta: end_play
          when: gopls_playbook_imported is defined
        - name: Ensure the gopls playbook is not included
          set_fact:
            gopls_playbook_imported: true
          when: gopls_playbook_imported is not defined

    - name: Check if gopls is installed
      shell: go version -m $(command -v gopls) | grep '^\s*mod\s'
      register: gopls_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract gopls version
      block:
        - name: Set gopls facts
          set_fact:
            gopls_module_path: "{{ gopls_installed.stdout.split()[1] }}"
            gopls_module_version: "{{ gopls_installed.stdout.split()[2] }}"
        - name: Determine the latest gopls version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ gopls_module_path }}@latest"
          register: gopls_latest
          ignore_errors: yes
          changed_when: False

        - name: Debug module path and version
          debug:
            msg: "{{ gopls_module_path }} {{ gopls_module_version }} => {{ gopls_latest.stdout }}"
      rescue:
        - name: Clear gopls facts
          set_fact:
            gopls_module_path: ""
            gopls_module_version: ""

    - name: Get gopls build Go version
      shell: go version -m $(command -v gopls) 2>/dev/null | head -1 | awk '{print $2}'
      register: gopls_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare gopls installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ gopls_module_version | default('') }}"
          - "{{ ((gopls_latest | default({})).stdout | default('')) | trim }}"
          - "{{ gopls_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
      register: gopls_version_check
      changed_when: false
      check_mode: false

    - name: Skip gopls upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping gopls: {{ (gopls_version_check.stdout | from_json).reason }}"
      when: (gopls_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade gopls
      command: go install golang.org/x/tools/gopls@latest
      register: gopls_upgrade
      until: gopls_upgrade is succeeded
      retries: 3
      delay: 30
      when: (gopls_version_check.stdout | from_json).action == 'install'
