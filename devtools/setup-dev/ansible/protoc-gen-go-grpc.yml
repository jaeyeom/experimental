          set_fact:
            protoc_gen_go_grpc_module_path: ""
            protoc_gen_go_grpc_module_version: ""

    - name: Get protoc-gen-go-grpc build Go version
      shell: go version -m $(command -v protoc-gen-go-grpc) 2>/dev/null | head -1 | awk '{print $2}'
