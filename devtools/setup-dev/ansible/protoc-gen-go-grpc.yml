        - name: Determine the latest protoc-gen-go-grpc version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ protoc_gen_go_grpc_module_path }}@latest"
          register: protoc_gen_go_grpc_latest
          ignore_errors: yes
          changed_when: False

