---
# Manual playbook. Debian and Ubuntu apt ship an old Go (Ubuntu noble is
# still Go 1.22). An existing binary was also left in place, so `go install`
# kept running it. `go install pkg@version` does not download a newer
# toolchain when only a dependency requires one, so the toolchain on PATH
# has to be the latest stable release.
- name: Ensure go is present
  hosts: all
  tasks:
    - name: Include guard for go playbook
      block:
        - name: Stop early if the go playbook is already included
          meta: end_play
          when: go_playbook_imported is defined
        - name: Ensure the go playbook is not included
          set_fact:
            go_playbook_imported: true
          when: go_playbook_imported is not defined

    - name: Ensure go is present on MacOS
      block:
        - name: Check if go is installed
          shell: command -v go
          changed_when: false
      rescue:
        - name: Install go on MacOS
          community.general.homebrew:
            name: go
            state: present
      when: ansible_facts['os_family'] == "Darwin"

    - name: Ensure the latest stable Go toolchain on Debian and Ubuntu
      when: ansible_facts['env']['TERMUX_VERSION'] is not defined and ansible_facts['os_family'] != "Darwin"
      block:
        - name: Read the installed Go version
          ansible.builtin.command: go env GOVERSION
          register: go_installed_version
          changed_when: false
          failed_when: false
          environment:
            GOTOOLCHAIN: local

        - name: Fetch the Go download index
          ansible.builtin.uri:
            url: https://go.dev/dl/?mode=json
            return_content: yes
          register: go_dl

        - name: Select the latest stable Go release for this architecture
          ansible.builtin.set_fact:
            go_stable_release: "{{ go_dl.json | selectattr('stable') | first }}"
            go_arch: "{{ go_arch_map[ansible_facts['architecture']] }}"
          vars:
            go_arch_map:
              x86_64: amd64
              aarch64: arm64
              armv6l: armv6l
              armv7l: armv6l
              i386: "386"
              ppc64le: ppc64le
              s390x: s390x
              riscv64: riscv64
              loongarch64: loong64

        - name: Select the Linux archive for this architecture
          ansible.builtin.set_fact:
            go_archive: "{{ go_stable_release.files | selectattr('kind', 'equalto', 'archive') | selectattr('os', 'equalto', 'linux') | selectattr('arch', 'equalto', go_arch) | first }}"

        - name: Download the latest stable Go toolchain
          ansible.builtin.get_url:
            url: "https://go.dev/dl/{{ go_archive.filename }}"
            dest: "/tmp/{{ go_archive.filename }}"
            checksum: "sha256:{{ go_archive.sha256 }}"
            mode: "0644"
          when: go_installed_version.stdout | default('') != go_stable_release.version

        # Official upgrade: remove the tree, then extract. Unpacking over an
        # existing /usr/local/go leaves stale files behind.
        - name: Install the latest stable Go under /usr/local/go
          ansible.builtin.shell: |
            set -euo pipefail
            rm -rf /usr/local/go
            tar -C /usr/local -xzf "/tmp/{{ go_archive.filename }}"
            rm -f "/tmp/{{ go_archive.filename }}"
          args:
            executable: /bin/bash
          become: true
          when: go_installed_version.stdout | default('') != go_stable_release.version

        # /usr/local/bin is already on PATH. Symlinks make the new toolchain
        # visible to later tasks in this run; the shell profile also prepends
        # /usr/local/go/bin for interactive shells.
        - name: Link Go toolchain commands into /usr/local/bin
          ansible.builtin.shell: |
            set -euo pipefail
            for cmd in /usr/local/go/bin/*; do
              ln -sfn "$cmd" "/usr/local/bin/$(basename "$cmd")"
            done
          args:
            executable: /bin/bash
          become: true

    - name: Ensure go is present on Termux
      block:
        - name: Check if go is installed
          shell: command -v go
          changed_when: false
      rescue:
        - name: Install go on Termux
          command: pkg install -y golang
      when: ansible_facts['env']['TERMUX_VERSION'] is defined
