- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure task is present
  hosts: all
  tasks:
    - name: Include guard for task playbook
      block:
        - name: Stop early if the task playbook is already included
          meta: end_play
          when: task_playbook_imported is defined
        - name: Ensure the task playbook is not included
          set_fact:
            task_playbook_imported: true
          when: task_playbook_imported is not defined

    - name: Check if task is installed
      shell: go version -m $(command -v task) | grep '^\s*mod\s'
      register: task_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract task version
      block:
        - name: Set task facts
          set_fact:
            task_module_path: "{{ task_installed.stdout.split()[1] }}"
            task_module_version: "{{ task_installed.stdout.split()[2] }}"
        - name: Determine the latest task version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ task_module_path }}@latest"
          register: task_latest
          ignore_errors: yes
          changed_when: False

        - name: Debug module path and version
          debug:
            msg: "{{ task_module_path }} {{ task_module_version }} => {{ task_latest.stdout }}"
      rescue:
        - name: Clear task facts
          set_fact:
            task_module_path: ""
            task_module_version: ""

    - name: Get task build Go version
      shell: go version -m $(command -v task) 2>/dev/null | head -1 | awk '{print $2}'
      register: task_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare task installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ task_module_version | default('') }}"
          - "{{ ((task_latest | default({})).stdout | default('')) | trim }}"
          - "{{ task_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
      register: task_version_check
      changed_when: false
      check_mode: false

    - name: Skip task upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping task: {{ (task_version_check.stdout | from_json).reason }}"
      when: (task_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade task
      command: go install github.com/go-task/task/v3/cmd/task@latest
      register: task_upgrade
      until: task_upgrade is succeeded
      retries: 3
      delay: 30
      when: (task_version_check.stdout | from_json).action == 'install'
