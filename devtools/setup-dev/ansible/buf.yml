- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure buf is present
  hosts: all
  tasks:
    - name: Include guard for buf playbook
      block:
        - name: Stop early if the buf playbook is already included
          meta: end_play
          when: buf_playbook_imported is defined
        - name: Ensure the buf playbook is not included
          set_fact:
            buf_playbook_imported: true
          when: buf_playbook_imported is not defined

    - name: Check if buf is installed
      shell: go version -m $(command -v buf) | grep '^\s*mod\s'
      register: buf_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract buf version
      block:
        - name: Set buf facts
          set_fact:
            buf_module_path: "{{ buf_installed.stdout.split()[1] }}"
            buf_module_version: "{{ buf_installed.stdout.split()[2] }}"
        - name: Determine the latest buf version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ buf_module_path }}@latest"
          register: buf_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            buf_module_path | length > 0 and
            (buf_module_path == 'github.com/bufbuild/buf/cmd/buf' or
            'github.com/bufbuild/buf/cmd/buf'.startswith(buf_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ buf_module_path }} {{ buf_module_version }} => {{ ((buf_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear buf facts
          set_fact:
            buf_module_path: ""
            buf_module_version: ""

    - name: Get buf build Go version
      shell: go version -m $(command -v buf) 2>/dev/null | head -1 | awk '{print $2}'
      register: buf_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare buf installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ buf_module_version | default('') }}"
          - "{{ ((buf_latest | default({})).stdout | default('')) | trim }}"
          - "{{ buf_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ buf_module_path | default('') | trim }}"
          - --target-module
          - github.com/bufbuild/buf/cmd/buf
      register: buf_version_check
      changed_when: false
      check_mode: false

    - name: Skip buf upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping buf: {{ (buf_version_check.stdout | from_json).reason }}"
      when: (buf_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade buf
      command: go install github.com/bufbuild/buf/cmd/buf@latest
      register: buf_upgrade
      until: buf_upgrade is succeeded
      retries: 3
      delay: 30
      when: (buf_version_check.stdout | from_json).action == 'install'
