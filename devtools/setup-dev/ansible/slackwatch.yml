# and then run: make
- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure slackwatch is present
  hosts: all
  tasks:
    - name: Include guard for slackwatch playbook
      block:
        - name: Stop early if the slackwatch playbook is already included
          meta: end_play
          when: slackwatch_playbook_imported is defined
        - name: Ensure the slackwatch playbook is not included
          set_fact:
            slackwatch_playbook_imported: true
          when: slackwatch_playbook_imported is not defined

    - name: Check if slackwatch is installed
      shell: go version -m $(command -v slackwatch) | grep '^\s*mod\s'
      register: slackwatch_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract slackwatch version
      block:
        - name: Set slackwatch facts
          set_fact:
            slackwatch_module_path: "{{ slackwatch_installed.stdout.split()[1] }}"
            slackwatch_module_version: "{{ slackwatch_installed.stdout.split()[2] }}"
        - name: Determine the latest slackwatch version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ slackwatch_module_path }}@latest"
          register: slackwatch_latest
          ignore_errors: yes
          changed_when: False

        - name: Debug module path and version
          debug:
            msg: "{{ slackwatch_module_path }} {{ slackwatch_module_version }} => {{ slackwatch_latest.stdout }}"
      rescue:
        - name: Clear slackwatch facts
          set_fact:
            slackwatch_module_path: ""
            slackwatch_module_version: ""

    - name: Get slackwatch build Go version
      shell: go version -m $(command -v slackwatch) 2>/dev/null | head -1 | awk '{print $2}'
      register: slackwatch_build_go
      ignore_errors: yes
      changed_when: false

    - name: Upgrade slackwatch
      command: go install github.com/jaeyeom/experimental/devtools/slackwatch/cmd/slackwatch@latest
      register: slackwatch_upgrade
      until: slackwatch_upgrade is succeeded
      retries: 3
      delay: 30
      when: >
        slackwatch_module_version is not defined or
        slackwatch_module_version == "" or
        slackwatch_module_version != slackwatch_latest.stdout or
        slackwatch_build_go.stdout | default('') != go_toolchain_version
