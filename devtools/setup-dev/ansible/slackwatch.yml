# and then run: make
- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure slackwatch is present
  hosts: all
  # The first file found is loaded. /dev/null keeps a missing vars file
  # from failing the play.
  vars_files:
    - - "{{ (lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or (lookup('ansible.builtin.env', 'HOME') ~ '/.config')) ~ '/setup-dev/vars.yml' }}"
      - /dev/null
  tasks:
    - name: Include guard for slackwatch playbook
      block:
        - name: Stop early if the slackwatch playbook is already included
          meta: end_play
          when: slackwatch_playbook_imported is defined
        - name: Ensure the slackwatch playbook is not included
          set_fact:
            slackwatch_playbook_imported: true
          when: slackwatch_playbook_imported is not defined

    - name: Check if slackwatch is installed
      shell: go version -m $(command -v slackwatch) | grep '^\s*mod\s'
      register: slackwatch_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract slackwatch version
      block:
        - name: Set slackwatch facts
          set_fact:
            slackwatch_module_path: "{{ slackwatch_installed.stdout.split()[1] }}"
            slackwatch_module_version: "{{ slackwatch_installed.stdout.split()[2] }}"
        - name: Determine the latest slackwatch version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "github.com/jaeyeom/experimental@{{ experimental_ref | default('main') }}"
          register: slackwatch_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            slackwatch_module_path | length > 0 and
            (slackwatch_module_path == 'github.com/jaeyeom/experimental' or
            'github.com/jaeyeom/experimental'.startswith(slackwatch_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ slackwatch_module_path }} {{ slackwatch_module_version }} => {{ ((slackwatch_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear slackwatch facts
          set_fact:
            slackwatch_module_path: ""
            slackwatch_module_version: ""

    - name: Get slackwatch build Go version
      shell: go version -m $(command -v slackwatch) 2>/dev/null | head -1 | awk '{print $2}'
      register: slackwatch_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare slackwatch installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ slackwatch_module_version | default('') }}"
          - "{{ ((slackwatch_latest | default({})).stdout | default('')) | trim }}"
          - "{{ slackwatch_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ slackwatch_module_path | default('') | trim }}"
          - --target-module
          - github.com/jaeyeom/experimental
      register: slackwatch_version_check
      changed_when: false
      check_mode: false

    - name: Skip slackwatch upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping slackwatch: {{ (slackwatch_version_check.stdout | from_json).reason }}"
      when: (slackwatch_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade slackwatch
      command: go install github.com/jaeyeom/experimental/devtools/slackwatch/cmd/slackwatch@{{ experimental_ref | default('main') }}
      register: slackwatch_upgrade
      until: slackwatch_upgrade is succeeded
      retries: 3
      delay: 30
      when: (slackwatch_version_check.stdout | from_json).action == 'install'
