- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure quotapace is present
  hosts: all
  # The first file found is loaded. /dev/null keeps a missing vars file
  # from failing the play.
  vars_files:
    - - "{{ (lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or (lookup('ansible.builtin.env', 'HOME') ~ '/.config')) ~ '/setup-dev/vars.yml' }}"
      - /dev/null
  tasks:
    - name: Include guard for quotapace playbook
      block:
        - name: Stop early if the quotapace playbook is already included
          meta: end_play
          when: quotapace_playbook_imported is defined
        - name: Ensure the quotapace playbook is not included
          set_fact:
            quotapace_playbook_imported: true
          when: quotapace_playbook_imported is not defined

    - name: Check if quotapace is installed
      shell: go version -m $(command -v quotapace) | grep '^\s*mod\s'
      register: quotapace_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract quotapace version
      block:
        - name: Set quotapace facts
          set_fact:
            quotapace_module_path: "{{ quotapace_installed.stdout.split()[1] }}"
            quotapace_module_version: "{{ quotapace_installed.stdout.split()[2] }}"
        - name: Determine the latest quotapace version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "github.com/jaeyeom/experimental@{{ experimental_ref | default('main') }}"
          register: quotapace_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            quotapace_module_path | length > 0 and
            (quotapace_module_path == 'github.com/jaeyeom/experimental' or
            'github.com/jaeyeom/experimental'.startswith(quotapace_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ quotapace_module_path }} {{ quotapace_module_version }} => {{ ((quotapace_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear quotapace facts
          set_fact:
            quotapace_module_path: ""
            quotapace_module_version: ""

    - name: Get quotapace build Go version
      shell: go version -m $(command -v quotapace) 2>/dev/null | head -1 | awk '{print $2}'
      register: quotapace_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare quotapace installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ quotapace_module_version | default('') }}"
          - "{{ ((quotapace_latest | default({})).stdout | default('')) | trim }}"
          - "{{ quotapace_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ quotapace_module_path | default('') | trim }}"
          - --target-module
          - github.com/jaeyeom/experimental
      register: quotapace_version_check
      changed_when: false
      check_mode: false

    - name: Skip quotapace upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping quotapace: {{ (quotapace_version_check.stdout | from_json).reason }}"
      when: (quotapace_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade quotapace
      command: go install github.com/jaeyeom/experimental/devtools/quotapace/cmd/quotapace@{{ experimental_ref | default('main') }}
      register: quotapace_upgrade
      until: quotapace_upgrade is succeeded
      retries: 3
      delay: 30
      when: (quotapace_version_check.stdout | from_json).action == 'install'
