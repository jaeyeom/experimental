- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure image2ascii is present
  hosts: all
  tasks:
    - name: Include guard for image2ascii playbook
      block:
        - name: Stop early if the image2ascii playbook is already included
          meta: end_play
          when: image2ascii_playbook_imported is defined
        - name: Ensure the image2ascii playbook is not included
          set_fact:
            image2ascii_playbook_imported: true
          when: image2ascii_playbook_imported is not defined

    - name: Check if image2ascii is installed
      shell: go version -m $(command -v image2ascii) | grep '^\s*mod\s'
      register: image2ascii_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract image2ascii version
      block:
        - name: Set image2ascii facts
          set_fact:
            image2ascii_module_path: "{{ image2ascii_installed.stdout.split()[1] }}"
            image2ascii_module_version: "{{ image2ascii_installed.stdout.split()[2] }}"
        - name: Determine the latest image2ascii version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ image2ascii_module_path }}@latest"
          register: image2ascii_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            image2ascii_module_path | length > 0 and
            (image2ascii_module_path == 'github.com/qeesung/image2ascii' or
            'github.com/qeesung/image2ascii'.startswith(image2ascii_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ image2ascii_module_path }} {{ image2ascii_module_version }} => {{ ((image2ascii_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear image2ascii facts
          set_fact:
            image2ascii_module_path: ""
            image2ascii_module_version: ""

    - name: Get image2ascii build Go version
      shell: go version -m $(command -v image2ascii) 2>/dev/null | head -1 | awk '{print $2}'
      register: image2ascii_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare image2ascii installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ image2ascii_module_version | default('') }}"
          - "{{ ((image2ascii_latest | default({})).stdout | default('')) | trim }}"
          - "{{ image2ascii_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ image2ascii_module_path | default('') | trim }}"
          - --target-module
          - github.com/qeesung/image2ascii
      register: image2ascii_version_check
      changed_when: false
      check_mode: false

    - name: Skip image2ascii upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping image2ascii: {{ (image2ascii_version_check.stdout | from_json).reason }}"
      when: (image2ascii_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade image2ascii
      command: go install github.com/qeesung/image2ascii@latest
      register: image2ascii_upgrade
      until: image2ascii_upgrade is succeeded
      retries: 3
      delay: 30
      when: (image2ascii_version_check.stdout | from_json).action == 'install'
