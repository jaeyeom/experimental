  when: (ansible_facts['env']['TERMUX_VERSION'] is defined) or (ansible_facts['env']['TERMUX_VERSION'] is not defined and ansible_facts['os_family'] != "Darwin")

- name: Ensure actionlint is present
  hosts: all
  tasks:
    - name: Include guard for actionlint playbook
      block:
        - name: Stop early if the actionlint playbook is already included
          meta: end_play
          when: actionlint_playbook_imported is defined
        - name: Ensure the actionlint playbook is not included
          set_fact:
            actionlint_playbook_imported: true
          when: actionlint_playbook_imported is not defined

    - name: Ensure actionlint is present on MacOS
      block:
        - name: Check if actionlint is installed
          shell: command -v actionlint
          changed_when: False
      rescue:
        - name: Install actionlint on MacOS
          community.general.homebrew:
            name: actionlint
            state: present
      when: ansible_facts['os_family'] == "Darwin"

    - name: Ensure actionlint is present on Termux
      block:
        - name: Check if actionlint is installed
          shell: go version -m $(command -v actionlint) | grep '^\s*mod\s'
          register: actionlint_installed
          ignore_errors: yes
          changed_when: False

        - name: Extract actionlint version
          block:
            - name: Set actionlint facts
              set_fact:
                actionlint_module_path: "{{ actionlint_installed.stdout.split()[1] }}"
                actionlint_module_version: "{{ actionlint_installed.stdout.split()[2] }}"
            - name: Determine the latest actionlint version
              command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ actionlint_module_path }}@latest"
              register: actionlint_latest
              ignore_errors: yes
              changed_when: False
              when: >-
                actionlint_module_path | length > 0 and
                (actionlint_module_path == 'github.com/rhysd/actionlint/cmd/actionlint' or
                'github.com/rhysd/actionlint/cmd/actionlint'.startswith(actionlint_module_path ~ '/'))

            - name: Debug module path and version
              debug:
                msg: "{{ actionlint_module_path }} {{ actionlint_module_version }} => {{ ((actionlint_latest | default({})).stdout | default('')) | trim }}"
          rescue:
            - name: Clear actionlint facts
              set_fact:
                actionlint_module_path: ""
                actionlint_module_version: ""

        - name: Get actionlint build Go version
          shell: go version -m $(command -v actionlint) 2>/dev/null | head -1 | awk '{print $2}'
          register: actionlint_build_go
          ignore_errors: yes
          changed_when: false

        - name: Compare actionlint installed and target versions
          ansible.builtin.command:
            argv:
              - python3
              - "{{ playbook_dir }}/go_version_compare.py"
              - "{{ actionlint_module_version | default('') }}"
              - "{{ ((actionlint_latest | default({})).stdout | default('')) | trim }}"
              - "{{ actionlint_build_go.stdout | default('') | trim }}"
              - "{{ go_toolchain_version | default('') | trim }}"
              - --installed-module
              - "{{ actionlint_module_path | default('') | trim }}"
              - --target-module
              - github.com/rhysd/actionlint/cmd/actionlint
          register: actionlint_version_check
          changed_when: false
          check_mode: false

        - name: Skip actionlint upgrade when target is not newer
          ansible.builtin.debug:
            msg: "Skipping actionlint: {{ (actionlint_version_check.stdout | from_json).reason }}"
          when: (actionlint_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

        - name: Upgrade actionlint
          command: go install github.com/rhysd/actionlint/cmd/actionlint@latest
          register: actionlint_upgrade
          until: actionlint_upgrade is succeeded
          retries: 3
          delay: 30
          when: (actionlint_version_check.stdout | from_json).action == 'install'
      when: ansible_facts['env']['TERMUX_VERSION'] is defined

