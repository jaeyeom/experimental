# and then run: make
- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure protolint is present
  hosts: all
  tasks:
    - name: Include guard for protolint playbook
      block:
        - name: Stop early if the protolint playbook is already included
          meta: end_play
          when: protolint_playbook_imported is defined
        - name: Ensure the protolint playbook is not included
          set_fact:
            protolint_playbook_imported: true
          when: protolint_playbook_imported is not defined

    - name: Check if protolint is installed
      shell: go version -m $(command -v protolint) | grep '^\s*mod\s'
      register: protolint_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract protolint version
      block:
        - name: Set protolint facts
          set_fact:
            protolint_module_path: "{{ protolint_installed.stdout.split()[1] }}"
            protolint_module_version: "{{ protolint_installed.stdout.split()[2] }}"
        - name: Determine the latest protolint version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ protolint_module_path }}@latest"
          register: protolint_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            protolint_module_path | length > 0 and
            (protolint_module_path == 'github.com/yoheimuta/protolint/cmd/protolint' or
            'github.com/yoheimuta/protolint/cmd/protolint'.startswith(protolint_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ protolint_module_path }} {{ protolint_module_version }} => {{ ((protolint_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear protolint facts
          set_fact:
            protolint_module_path: ""
            protolint_module_version: ""

    - name: Get protolint build Go version
      shell: go version -m $(command -v protolint) 2>/dev/null | head -1 | awk '{print $2}'
      register: protolint_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare protolint installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ protolint_module_version | default('') }}"
          - "{{ ((protolint_latest | default({})).stdout | default('')) | trim }}"
          - "{{ protolint_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ protolint_module_path | default('') | trim }}"
          - --target-module
          - github.com/yoheimuta/protolint/cmd/protolint
      register: protolint_version_check
      changed_when: false
      check_mode: false

    - name: Skip protolint upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping protolint: {{ (protolint_version_check.stdout | from_json).reason }}"
      when: (protolint_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade protolint
      command: go install github.com/yoheimuta/protolint/cmd/protolint@latest
      register: protolint_upgrade
      until: protolint_upgrade is succeeded
      retries: 3
      delay: 30
      when: (protolint_version_check.stdout | from_json).action == 'install'
