- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure buildozer is present
  hosts: all
  tasks:
    - name: Include guard for buildozer playbook
      block:
        - name: Stop early if the buildozer playbook is already included
          meta: end_play
          when: buildozer_playbook_imported is defined
        - name: Ensure the buildozer playbook is not included
          set_fact:
            buildozer_playbook_imported: true
          when: buildozer_playbook_imported is not defined

    - name: Check if buildozer is installed
      shell: go version -m $(command -v buildozer) | grep '^\s*mod\s'
      register: buildozer_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract buildozer version
      block:
        - name: Set buildozer facts
          set_fact:
            buildozer_module_path: "{{ buildozer_installed.stdout.split()[1] }}"
            buildozer_module_version: "{{ buildozer_installed.stdout.split()[2] }}"
        - name: Determine the latest buildozer version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ buildozer_module_path }}@latest"
          register: buildozer_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            buildozer_module_path | length > 0 and
            (buildozer_module_path == 'github.com/bazelbuild/buildtools/buildozer' or
            'github.com/bazelbuild/buildtools/buildozer'.startswith(buildozer_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ buildozer_module_path }} {{ buildozer_module_version }} => {{ ((buildozer_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear buildozer facts
          set_fact:
            buildozer_module_path: ""
            buildozer_module_version: ""

    - name: Get buildozer build Go version
      shell: go version -m $(command -v buildozer) 2>/dev/null | head -1 | awk '{print $2}'
      register: buildozer_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare buildozer installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ buildozer_module_version | default('') }}"
          - "{{ ((buildozer_latest | default({})).stdout | default('')) | trim }}"
          - "{{ buildozer_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ buildozer_module_path | default('') | trim }}"
          - --target-module
          - github.com/bazelbuild/buildtools/buildozer
      register: buildozer_version_check
      changed_when: false
      check_mode: false

    - name: Skip buildozer upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping buildozer: {{ (buildozer_version_check.stdout | from_json).reason }}"
      when: (buildozer_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade buildozer
      command: go install github.com/bazelbuild/buildtools/buildozer@latest
      register: buildozer_upgrade
      until: buildozer_upgrade is succeeded
      retries: 3
      delay: 30
      when: (buildozer_version_check.stdout | from_json).action == 'install'
