- name: Ensure gitleaks is present
  hosts: all
  tasks:
    - name: Include guard for gitleaks playbook
      block:
        - name: Stop early if the gitleaks playbook is already included
          meta: end_play
          when: gitleaks_playbook_imported is defined
        - name: Ensure the gitleaks playbook is not included
          set_fact:
            gitleaks_playbook_imported: true
          when: gitleaks_playbook_imported is not defined

    - name: Ensure gitleaks is present on MacOS
      block:
        - name: Check if gitleaks is installed
          shell: command -v gitleaks
          changed_when: False
      rescue:
        - name: Install gitleaks on MacOS
          community.general.homebrew:
            name: gitleaks
            state: present
      when: ansible_facts['os_family'] == "Darwin"

    - name: Ensure gitleaks is present on Termux
      block:
        - name: Check if gitleaks is installed
          shell: go version -m $(command -v gitleaks) | grep '^\s*mod\s'
          register: gitleaks_installed
          ignore_errors: yes
          changed_when: False

        - name: Extract gitleaks version
          block:
            - name: Set gitleaks facts
              set_fact:
                gitleaks_module_path: "{{ gitleaks_installed.stdout.split()[1] }}"
                gitleaks_module_version: "{{ gitleaks_installed.stdout.split()[2] }}"
            - name: Determine the latest gitleaks version
              command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ gitleaks_module_path }}@latest"
              register: gitleaks_latest
              ignore_errors: yes
              changed_when: False

            - name: Debug module path and version
              debug:
                msg: "{{ gitleaks_module_path }} {{ gitleaks_module_version }} => {{ gitleaks_latest.stdout }}"
          rescue:
            - name: Clear gitleaks facts
              set_fact:
                gitleaks_module_path: ""
                gitleaks_module_version: ""

        - name: Get gitleaks build Go version
          shell: go version -m $(command -v gitleaks) 2>/dev/null | head -1 | awk '{print $2}'
          register: gitleaks_build_go
          ignore_errors: yes
          changed_when: false

        - name: Upgrade gitleaks
          command: go install github.com/zricethezav/gitleaks/v8@latest
          register: gitleaks_upgrade
          until: gitleaks_upgrade is succeeded
          retries: 3
          delay: 30
          when: >
            gitleaks_module_version is not defined or
            gitleaks_module_version == "" or
            gitleaks_module_version != gitleaks_latest.stdout or
            gitleaks_build_go.stdout | default('') != go_toolchain_version
      when: ansible_facts['env']['TERMUX_VERSION'] is defined

