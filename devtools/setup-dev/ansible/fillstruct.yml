- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure fillstruct is present
  hosts: all
  tasks:
    - name: Include guard for fillstruct playbook
      block:
        - name: Stop early if the fillstruct playbook is already included
          meta: end_play
          when: fillstruct_playbook_imported is defined
        - name: Ensure the fillstruct playbook is not included
          set_fact:
            fillstruct_playbook_imported: true
          when: fillstruct_playbook_imported is not defined

    - name: Check if fillstruct is installed
      shell: go version -m $(command -v fillstruct) | grep '^\s*mod\s'
      register: fillstruct_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract fillstruct version
      block:
        - name: Set fillstruct facts
          set_fact:
            fillstruct_module_path: "{{ fillstruct_installed.stdout.split()[1] }}"
            fillstruct_module_version: "{{ fillstruct_installed.stdout.split()[2] }}"
        - name: Determine the latest fillstruct version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ fillstruct_module_path }}@latest"
          register: fillstruct_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            fillstruct_module_path | length > 0 and
            (fillstruct_module_path == 'github.com/davidrjenni/reftools/cmd/fillstruct' or
            'github.com/davidrjenni/reftools/cmd/fillstruct'.startswith(fillstruct_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ fillstruct_module_path }} {{ fillstruct_module_version }} => {{ ((fillstruct_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear fillstruct facts
          set_fact:
            fillstruct_module_path: ""
            fillstruct_module_version: ""

    - name: Get fillstruct build Go version
      shell: go version -m $(command -v fillstruct) 2>/dev/null | head -1 | awk '{print $2}'
      register: fillstruct_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare fillstruct installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ fillstruct_module_version | default('') }}"
          - "{{ ((fillstruct_latest | default({})).stdout | default('')) | trim }}"
          - "{{ fillstruct_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ fillstruct_module_path | default('') | trim }}"
          - --target-module
          - github.com/davidrjenni/reftools/cmd/fillstruct
      register: fillstruct_version_check
      changed_when: false
      check_mode: false

    - name: Skip fillstruct upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping fillstruct: {{ (fillstruct_version_check.stdout | from_json).reason }}"
      when: (fillstruct_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade fillstruct
      command: go install github.com/davidrjenni/reftools/cmd/fillstruct@latest
      register: fillstruct_upgrade
      until: fillstruct_upgrade is succeeded
      retries: 3
      delay: 30
      when: (fillstruct_version_check.stdout | from_json).action == 'install'
