- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure godoctor is present
  hosts: all
  tasks:
    - name: Include guard for godoctor playbook
      block:
        - name: Stop early if the godoctor playbook is already included
          meta: end_play
          when: godoctor_playbook_imported is defined
        - name: Ensure the godoctor playbook is not included
          set_fact:
            godoctor_playbook_imported: true
          when: godoctor_playbook_imported is not defined

    - name: Check if godoctor is installed
      shell: go version -m $(command -v godoctor) | grep '^\s*mod\s'
      register: godoctor_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract godoctor version
      block:
        - name: Set godoctor facts
          set_fact:
            godoctor_module_path: "{{ godoctor_installed.stdout.split()[1] }}"
            godoctor_module_version: "{{ godoctor_installed.stdout.split()[2] }}"
        - name: Determine the latest godoctor version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ godoctor_module_path }}@latest"
          register: godoctor_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            godoctor_module_path | length > 0 and
            (godoctor_module_path == 'github.com/godoctor/godoctor' or
            'github.com/godoctor/godoctor'.startswith(godoctor_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ godoctor_module_path }} {{ godoctor_module_version }} => {{ ((godoctor_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear godoctor facts
          set_fact:
            godoctor_module_path: ""
            godoctor_module_version: ""

    - name: Get godoctor build Go version
      shell: go version -m $(command -v godoctor) 2>/dev/null | head -1 | awk '{print $2}'
      register: godoctor_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare godoctor installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ godoctor_module_version | default('') }}"
          - "{{ ((godoctor_latest | default({})).stdout | default('')) | trim }}"
          - "{{ godoctor_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ godoctor_module_path | default('') | trim }}"
          - --target-module
          - github.com/godoctor/godoctor
      register: godoctor_version_check
      changed_when: false
      check_mode: false

    - name: Skip godoctor upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping godoctor: {{ (godoctor_version_check.stdout | from_json).reason }}"
      when: (godoctor_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade godoctor
      command: go install github.com/godoctor/godoctor@latest
      register: godoctor_upgrade
      until: godoctor_upgrade is succeeded
      retries: 3
      delay: 30
      when: (godoctor_version_check.stdout | from_json).action == 'install'
