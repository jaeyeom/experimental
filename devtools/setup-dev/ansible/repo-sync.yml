- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure repo-sync is present
  hosts: all
  # The first file found is loaded. /dev/null keeps a missing vars file
  # from failing the play.
  vars_files:
    - - "{{ (lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or (lookup('ansible.builtin.env', 'HOME') ~ '/.config')) ~ '/setup-dev/vars.yml' }}"
      - /dev/null
  tasks:
    - name: Include guard for repo-sync playbook
      block:
        - name: Stop early if the repo-sync playbook is already included
          meta: end_play
          when: repo_sync_playbook_imported is defined
        - name: Ensure the repo-sync playbook is not included
          set_fact:
            repo_sync_playbook_imported: true
          when: repo_sync_playbook_imported is not defined

    - name: Check if repo-sync is installed
      shell: go version -m $(command -v repo-sync) | grep '^\s*mod\s'
      register: repo_sync_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract repo-sync version
      block:
        - name: Set repo-sync facts
          set_fact:
            repo_sync_module_path: "{{ repo_sync_installed.stdout.split()[1] }}"
            repo_sync_module_version: "{{ repo_sync_installed.stdout.split()[2] }}"
        - name: Determine the latest repo-sync version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "github.com/jaeyeom/experimental@{{ experimental_ref | default('main') }}"
          register: repo_sync_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            repo_sync_module_path | length > 0 and
            (repo_sync_module_path == 'github.com/jaeyeom/experimental' or
            'github.com/jaeyeom/experimental'.startswith(repo_sync_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ repo_sync_module_path }} {{ repo_sync_module_version }} => {{ ((repo_sync_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear repo-sync facts
          set_fact:
            repo_sync_module_path: ""
            repo_sync_module_version: ""

    - name: Get repo-sync build Go version
      shell: go version -m $(command -v repo-sync) 2>/dev/null | head -1 | awk '{print $2}'
      register: repo_sync_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare repo-sync installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ repo_sync_module_version | default('') }}"
          - "{{ ((repo_sync_latest | default({})).stdout | default('')) | trim }}"
          - "{{ repo_sync_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ repo_sync_module_path | default('') | trim }}"
          - --target-module
          - github.com/jaeyeom/experimental
      register: repo_sync_version_check
      changed_when: false
      check_mode: false

    - name: Skip repo-sync upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping repo-sync: {{ (repo_sync_version_check.stdout | from_json).reason }}"
      when: (repo_sync_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade repo-sync
      command: go install github.com/jaeyeom/experimental/devtools/repo-sync/cmd/repo-sync@{{ experimental_ref | default('main') }}
      register: repo_sync_upgrade
      until: repo_sync_upgrade is succeeded
      retries: 3
      delay: 30
      when: (repo_sync_version_check.stdout | from_json).action == 'install'
