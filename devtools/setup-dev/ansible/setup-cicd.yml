---
# JS lint/format: oxlint + oxfmt are the default; biome, eslint, and prettier stay installed for other repos.
- import_playbook: lcov.yml
- import_playbook: shellcheck.yml
- import_playbook: bazel-affected-tests.yml
- import_playbook: org-lint.yml
- import_playbook: task.yml
- import_playbook: copier.yml
- import_playbook: oxlint.yml
- import_playbook: oxfmt.yml
- import_playbook: biome.yml
- import_playbook: eslint.yml
- import_playbook: prettier.yml
- import_playbook: act.yml
- import_playbook: actionlint.yml
- import_playbook: circleci.yml

- name: Setup CI/CD environment
  hosts: all
  tasks:
    - name: Include guard for setup-cicd playbook
      block:
        - name: Stop early if the setup-cicd playbook is already included
          meta: end_play
          when: setup_cicd_playbook_imported is defined
        - name: Ensure the setup-cicd playbook is not included
          set_fact:
            setup_cicd_playbook_imported: true
          when: setup_cicd_playbook_imported is not defined

    - name: CI/CD environment setup completed
      debug:
        msg: "All CI/CD tools have been installed: lcov, shellcheck, bazel-affected-tests, org-lint, task, copier, oxlint, oxfmt, biome, eslint, prettier, act, actionlint, circleci"
