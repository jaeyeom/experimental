---
# Installs decide and delegates agent skill installation to `decide skill install`.
# Running decide as a service stays manual.
- import_playbook: decide.yml

- name: Ensure the decide agent skill is installed
  hosts: all
  tasks:
    - name: Include guard for setup-decide playbook
      block:
        - name: Stop early if the setup-decide playbook is already included
          meta: end_play
          when: setup_decide_playbook_imported is defined
        - name: Ensure the setup-decide playbook is not included
          set_fact:
            setup_decide_playbook_imported: true
          when: setup_decide_playbook_imported is not defined

    # The lookups below only read, so they also run under --check; a missing go
    # leaves PATH as is.
    - name: Determine GOPATH for decide commands
      ansible.builtin.command: go env GOPATH
      register: go_env_gopath
      changed_when: false
      failed_when: false
      check_mode: false
      environment:
        GOTOOLCHAIN: local
      tags: [decide_skill]

    - name: Set PATH for decide commands
      set_fact:
        decide_skill_env_path: >-
          {{ (go_env_gopath.stdout ~ '/bin:')
             if (go_env_gopath.rc | default(1)) == 0 and (go_env_gopath.stdout | default('') | length) > 0
             else '' }}{{ ansible_facts['env']['PATH'] }}
      tags: [decide_skill]

    - name: Check whether decide is installed
      ansible.builtin.shell: command -v decide
      register: decide_skill_command_check
      changed_when: false
      failed_when: false
      check_mode: false
      environment:
        PATH: "{{ decide_skill_env_path }}"
      tags: [decide_skill]

    - name: Warn when decide is not installed
      ansible.builtin.debug:
        msg: >-
          WARNING: Skipping decide skill install because decide is not on PATH.
          Nothing was written.
      when: decide_skill_command_check.rc != 0
      tags: [decide_skill]

    - name: Dry-run decide skill install
      ansible.builtin.command:
        argv:
          - decide
          - skill
          - install
          - --agent
          - all
          - --force
          - --dry-run
      register: decide_skill_dry_run
      changed_when: false
      failed_when: >-
        decide_skill_dry_run.rc != 0 and
        'no supported agents found' not in (decide_skill_dry_run.stderr | default(''))
      check_mode: false
      when: decide_skill_command_check.rc == 0
      environment:
        PATH: "{{ decide_skill_env_path }}"
      tags: [decide_skill]

    - name: Warn when no supported agents are found for decide skill
      ansible.builtin.debug:
        msg: >-
          WARNING: Skipping decide skill install because no supported agents were found.
          Nothing was written.
      when:
        - decide_skill_command_check.rc == 0
        - decide_skill_dry_run.rc | default(1) != 0
        - "'no supported agents found' in (decide_skill_dry_run.stderr | default(''))"
      tags: [decide_skill]

    - name: Check decide skill status
      ansible.builtin.command:
        argv:
          - decide
          - skill
          - status
          - --json
      register: decide_skill_status
      changed_when: false
      check_mode: false
      when:
        - decide_skill_command_check.rc == 0
        - decide_skill_dry_run.rc | default(1) == 0
      environment:
        PATH: "{{ decide_skill_env_path }}"
      tags: [decide_skill]

    - name: Determine whether decide skill install is needed
      set_fact:
        decide_skill_target_paths: >-
          {{ decide_skill_dry_run.stdout_lines | default([])
             | select('match', '^would install [^:]+ \(user\): ')
             | map('regex_replace', '^would install [^:]+ \(user\): ', '')
             | list }}
        decide_skill_current_paths: >-
          {{ (decide_skill_status.stdout | from_json).entries | default([])
             | selectattr('scope', 'equalto', 'user')
             | selectattr('status', 'equalto', 'current')
             | map(attribute='path')
             | list }}
      when:
        - decide_skill_command_check.rc == 0
        - decide_skill_dry_run.rc | default(1) == 0
      tags: [decide_skill]

    # --force migrates verified-run-written (foreign) SKILL.md files to
    # toolcli-managed files. Under --check the command module does not run,
    # so nothing is written.
    - name: Install the decide agent skill
      ansible.builtin.command:
        argv:
          - decide
          - skill
          - install
          - --agent
          - all
          - --force
      register: decide_skill_install
      when:
        - decide_skill_command_check.rc == 0
        - decide_skill_dry_run.rc | default(1) == 0
        - (decide_skill_target_paths | default([]) | difference(decide_skill_current_paths | default([])) | length) > 0
      environment:
        PATH: "{{ decide_skill_env_path }}"
      tags: [decide_skill]
