- import_playbook: gh.yml
- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure gh-pr-review is present
  hosts: all
  # The first file found is loaded. /dev/null keeps a missing vars file
  # from failing the play.
  vars_files:
    - - "{{ (lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or (lookup('ansible.builtin.env', 'HOME') ~ '/.config')) ~ '/setup-dev/vars.yml' }}"
      - /dev/null
  tasks:
    - name: Include guard for gh-pr-review playbook
      block:
        - name: Stop early if the gh-pr-review playbook is already included
          meta: end_play
          when: gh_pr_review_playbook_imported is defined
        - name: Ensure the gh-pr-review playbook is not included
          set_fact:
            gh_pr_review_playbook_imported: true
          when: gh_pr_review_playbook_imported is not defined

    - name: Check if gh-pr-review is installed
      shell: go version -m $(command -v gh-pr-review) | grep '^\s*mod\s'
      register: gh_pr_review_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract gh-pr-review version
      block:
        - name: Set gh-pr-review facts
          set_fact:
            gh_pr_review_module_path: "{{ gh_pr_review_installed.stdout.split()[1] }}"
            gh_pr_review_module_version: "{{ gh_pr_review_installed.stdout.split()[2] }}"
        - name: Determine the latest gh-pr-review version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ gh_pr_review_module_path }}@{{ experimental_ref | default('main') }}"
          register: gh_pr_review_latest
          ignore_errors: yes
          changed_when: False

        - name: Debug module path and version
          debug:
            msg: "{{ gh_pr_review_module_path }} {{ gh_pr_review_module_version }} => {{ gh_pr_review_latest.stdout }}"
      rescue:
        - name: Clear gh-pr-review facts
          set_fact:
            gh_pr_review_module_path: ""
            gh_pr_review_module_version: ""

    - name: Get gh-pr-review build Go version
      shell: go version -m $(command -v gh-pr-review) 2>/dev/null | head -1 | awk '{print $2}'
      register: gh_pr_review_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare gh-pr-review installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ gh_pr_review_module_version | default('') }}"
          - "{{ ((gh_pr_review_latest | default({})).stdout | default('')) | trim }}"
          - "{{ gh_pr_review_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
      register: gh_pr_review_version_check
      changed_when: false
      check_mode: false

    - name: Skip gh-pr-review upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping gh-pr-review: {{ (gh_pr_review_version_check.stdout | from_json).reason }}"
      when: (gh_pr_review_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade gh-pr-review
      command: go install github.com/jaeyeom/experimental/devtools/gh-nudge/cmd/gh-pr-review@{{ experimental_ref | default('main') }}
      register: gh_pr_review_upgrade
      until: gh_pr_review_upgrade is succeeded
      retries: 3
      delay: 30
      when: (gh_pr_review_version_check.stdout | from_json).action == 'install'
