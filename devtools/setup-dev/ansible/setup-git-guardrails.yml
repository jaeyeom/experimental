---
- import_playbook: setup-user-bin-directory.yml

- name: Install git-guardrails Claude plugin
  hosts: all
  tasks:
    - name: Include guard for setup-git-guardrails playbook
      block:
        - name: Stop early if the setup-git-guardrails playbook is already included
          meta: end_play
          when: setup_git_guardrails_playbook_imported is defined
        - name: Ensure the setup-git-guardrails playbook is not included
          set_fact:
            setup_git_guardrails_playbook_imported: true
          when: setup_git_guardrails_playbook_imported is not defined

    - name: Check if claude is installed
      shell: command -v claude
      register: claude_check
      failed_when: false
      changed_when: false

    - name: Update claude-toolbox marketplace
      command: claude plugin marketplace update claude-toolbox
      when: claude_check.rc == 0
      changed_when: false

    - name: Install git-guardrails plugin
      command: claude plugin install git-guardrails@claude-toolbox
      when: claude_check.rc == 0
      changed_when: true

    - name: Remove shims replaced by git-guardrails plugin
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ user_shims_bin_directory }}/find"
        - "{{ user_bin_directory }}/find"
        - "{{ user_shims_bin_directory }}/git"
        - "{{ user_bin_directory }}/git"
      when: claude_check.rc == 0
