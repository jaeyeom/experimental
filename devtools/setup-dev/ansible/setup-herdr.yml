---
# herdr publishes Linux and macOS builds only. Gather facts first so the
# import condition can see TERMUX_VERSION, then skip configuration on Termux
# where the binary is not installed.
- import_playbook: gather-facts.yml
- import_playbook: herdr.yml
  when: ansible_facts['env']['TERMUX_VERSION'] is not defined

- name: Ensure herdr is configured
  hosts: all
  vars:
    # herdr resolves its config through XDG on every platform (including
    # macOS), so a single path works everywhere herdr itself runs.
    herdr_config_dir: >-
      {{ ansible_facts['env']['XDG_CONFIG_HOME']
         | default(ansible_facts['env']['HOME'] ~ '/.config', true) }}/herdr
    # Each entry receives the same `herdr --skill` text. Add paths for other
    # agents here; the tasks below loop over this list.
    herdr_skill_paths:
      - "{{ ansible_facts['env']['HOME'] }}/.claude/skills/herdr/SKILL.md"
  tasks:
    - name: Skip herdr setup on Termux
      meta: end_play
      when: ansible_facts['env']['TERMUX_VERSION'] is defined

    - name: Include guard for setup-herdr playbook
      block:
        - name: Stop early if the setup-herdr playbook is already included
          meta: end_play
          when: setup_herdr_playbook_imported is defined
        - name: Ensure the setup-herdr playbook is not included
          set_fact:
            setup_herdr_playbook_imported: true
          when: setup_herdr_playbook_imported is not defined

    - name: Ensure the herdr config directory exists
      ansible.builtin.file:
        path: "{{ herdr_config_dir }}"
        state: directory
        mode: '0755'

    - name: Ensure herdr uses ctrl+] and leaves close_pane unbound
      ansible.builtin.blockinfile:
        path: "{{ herdr_config_dir }}/config.toml"
        append_newline: true
        prepend_newline: true
        create: true
        mode: '0644'
        marker: "# {mark} herdr prefix setup"
        block: |
          # Prefix key: ctrl+] instead of the default ctrl+b, matching the
          # tmux prefix set by setup-tmux.yml.
          # Deliberately NOT ctrl+[ -- that byte is 0x1b, which IS Escape, and
          # rebinding it breaks Esc, arrow keys, and every ANSI escape
          # sequence.
          # Action bindings are symbolic ("prefix+c", "prefix+v", ...), so they
          # follow this key automatically and need no changes.
          # prefix+x (close_pane) sits next to prefix+c (new tab). An empty
          # binding drops that shortcut. The mouse menu and `herdr pane close`
          # still close a pane.
          [keys]
          prefix = "ctrl+]"
          close_pane = ""
      register: herdr_prefix_config

    # blockinfile appends the managed block verbatim, so a hand-written [keys]
    # table elsewhere in config.toml would become a duplicate table and herdr
    # would silently fall back to its defaults. Fail loudly instead.
    - name: Validate the herdr configuration
      ansible.builtin.command: herdr config check
      register: herdr_config_check
      changed_when: false
      failed_when: herdr_config_check.rc != 0
      environment:
        PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

    # Applies the keybinding change to an already-running session. A missing
    # server is the normal case on a fresh machine, so failures here are not fatal.
    - name: Reload the configuration in a running herdr server
      ansible.builtin.command: herdr server reload-config
      register: herdr_reload
      changed_when: false
      failed_when: false
      when: herdr_prefix_config is changed
      environment:
        PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

    # strip_empty_ends would drop the trailing newline and make the installed
    # file differ from `herdr --skill`. No banner: skill frontmatter must stay
    # first, and the file must match the command output byte for byte.
    - name: Check whether herdr is installed
      ansible.builtin.shell: command -v herdr
      register: herdr_skill_command_check
      changed_when: false
      failed_when: false
      environment:
        PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

    - name: Warn when herdr is not installed
      ansible.builtin.debug:
        msg: >-
          WARNING: Skipping herdr skill install because herdr is not on PATH.
          Nothing was written.
      when: herdr_skill_command_check.rc != 0

    - name: Read the herdr agent skill
      ansible.builtin.command:
        cmd: herdr --skill
        strip_empty_ends: false
      register: herdr_skill_output
      changed_when: false
      failed_when: false
      when: herdr_skill_command_check.rc == 0
      environment:
        PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"

    - name: Warn when herdr --skill fails
      ansible.builtin.debug:
        msg: >-
          WARNING: Skipping herdr skill install because `herdr --skill`
          exited {{ herdr_skill_output.rc | default('unknown') }}.
          Nothing was written.
      when:
        - herdr_skill_command_check.rc == 0
        - herdr_skill_output.rc | default(1) != 0

    - name: Warn when herdr --skill prints nothing
      ansible.builtin.debug:
        msg: >-
          WARNING: Skipping herdr skill install because `herdr --skill`
          printed nothing. Nothing was written.
      when:
        - herdr_skill_command_check.rc == 0
        - herdr_skill_output.rc | default(1) == 0
        - (herdr_skill_output.stdout | default('') | trim | length) == 0

    - name: Ensure herdr skill parent directories exist
      ansible.builtin.file:
        path: "{{ item | dirname }}"
        state: directory
        mode: '0755'
      loop: "{{ herdr_skill_paths }}"
      when:
        - herdr_skill_command_check.rc == 0
        - herdr_skill_output.rc | default(1) == 0
        - (herdr_skill_output.stdout | default('') | trim | length) > 0

    # ensure.sh passes setup_dev_defer_skill_apply so it can review in a
    # shell that has a terminal and write the file afterward. This task
    # warns and does not run apply-text in that case. A direct
    # ansible-playbook run leaves the var unset, so a new or changed skill
    # fails the install task below and prints the review-text command.
    - name: Warn when ensure.sh will write the herdr agent skill
      ansible.builtin.debug:
        msg: >-
          WARNING: Skipping herdr skill apply-text because ensure.sh will
          review and write it after the playbooks.
      when:
        - setup_dev_defer_skill_apply | default(false) | bool
        - herdr_skill_command_check.rc == 0
        - herdr_skill_output.rc | default(1) == 0
        - (herdr_skill_output.stdout | default('') | trim | length) > 0

    # apply-text writes the raw `herdr --skill` bytes when they match the
    # stored approval. Stdout is `updated` or `unchanged`.
    - name: Install the herdr agent skill
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/verified-run"
          - apply-text
          - herdr-skill
          - "{{ item }}"
          - "--"
          - herdr
          - --skill
      loop: "{{ herdr_skill_paths }}"
      register: herdr_skill_apply
      changed_when: (herdr_skill_apply.stdout | trim) == "updated"
      when:
        - not (setup_dev_defer_skill_apply | default(false) | bool)
        - herdr_skill_command_check.rc == 0
        - herdr_skill_output.rc | default(1) == 0
        - (herdr_skill_output.stdout | default('') | trim | length) > 0
      environment:
        PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
