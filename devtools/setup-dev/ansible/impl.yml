- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure impl is present
  hosts: all
  tasks:
    - name: Include guard for impl playbook
      block:
        - name: Stop early if the impl playbook is already included
          meta: end_play
          when: impl_playbook_imported is defined
        - name: Ensure the impl playbook is not included
          set_fact:
            impl_playbook_imported: true
          when: impl_playbook_imported is not defined

    - name: Check if impl is installed
      shell: go version -m $(command -v impl) | grep '^\s*mod\s'
      register: impl_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract impl version
      block:
        - name: Set impl facts
          set_fact:
            impl_module_path: "{{ impl_installed.stdout.split()[1] }}"
            impl_module_version: "{{ impl_installed.stdout.split()[2] }}"
        - name: Determine the latest impl version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ impl_module_path }}@latest"
          register: impl_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            impl_module_path | length > 0 and
            (impl_module_path == 'github.com/josharian/impl' or
            'github.com/josharian/impl'.startswith(impl_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ impl_module_path }} {{ impl_module_version }} => {{ ((impl_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear impl facts
          set_fact:
            impl_module_path: ""
            impl_module_version: ""

    - name: Get impl build Go version
      shell: go version -m $(command -v impl) 2>/dev/null | head -1 | awk '{print $2}'
      register: impl_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare impl installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ impl_module_version | default('') }}"
          - "{{ ((impl_latest | default({})).stdout | default('')) | trim }}"
          - "{{ impl_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ impl_module_path | default('') | trim }}"
          - --target-module
          - github.com/josharian/impl
      register: impl_version_check
      changed_when: false
      check_mode: false

    - name: Skip impl upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping impl: {{ (impl_version_check.stdout | from_json).reason }}"
      when: (impl_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade impl
      command: go install github.com/josharian/impl@latest
      register: impl_upgrade
      until: impl_upgrade is succeeded
      retries: 3
      delay: 30
      when: (impl_version_check.stdout | from_json).action == 'install'
