---
# Installs slackwatch and delegates agent skill installation to `slackwatch skill install`.
# Installing the service, Slack credentials and starting the server stay manual.
- import_playbook: slackwatch.yml

- name: Ensure the slackwatch agent skill is installed
  hosts: all
  tasks:
    - name: Include guard for setup-slackwatch playbook
      block:
        - name: Stop early if the setup-slackwatch playbook is already included
          meta: end_play
          when: setup_slackwatch_playbook_imported is defined
        - name: Ensure the setup-slackwatch playbook is not included
          set_fact:
            setup_slackwatch_playbook_imported: true
          when: setup_slackwatch_playbook_imported is not defined

    # The lookups below only read, so they also run under --check; a missing go
    # leaves PATH as is.
    - name: Determine GOPATH for slackwatch commands
      ansible.builtin.command: go env GOPATH
      register: go_env_gopath
      changed_when: false
      failed_when: false
      check_mode: false
      environment:
        GOTOOLCHAIN: local
      tags: [slackwatch_skill]

    - name: Set PATH for slackwatch commands
      set_fact:
        slackwatch_skill_env_path: >-
          {{ (go_env_gopath.stdout ~ '/bin:')
             if (go_env_gopath.rc | default(1)) == 0 and (go_env_gopath.stdout | default('') | length) > 0
             else '' }}{{ ansible_facts['env']['PATH'] }}
      tags: [slackwatch_skill]

    - name: Check whether slackwatch is installed
      ansible.builtin.shell: command -v slackwatch
      register: slackwatch_skill_command_check
      changed_when: false
      failed_when: false
      check_mode: false
      environment:
        PATH: "{{ slackwatch_skill_env_path }}"
      tags: [slackwatch_skill]

    - name: Warn when slackwatch is not installed
      ansible.builtin.debug:
        msg: >-
          WARNING: Skipping slackwatch skill install because slackwatch is not on PATH.
          Nothing was written.
      when: slackwatch_skill_command_check.rc != 0
      tags: [slackwatch_skill]

    - name: Dry-run slackwatch skill install
      ansible.builtin.command:
        argv:
          - slackwatch
          - skill
          - install
          - --agent
          - all
          - --force
          - --dry-run
      register: slackwatch_skill_dry_run
      changed_when: false
      failed_when: >-
        slackwatch_skill_dry_run.rc != 0 and
        'no supported agents found' not in (slackwatch_skill_dry_run.stderr | default(''))
      check_mode: false
      when: slackwatch_skill_command_check.rc == 0
      environment:
        PATH: "{{ slackwatch_skill_env_path }}"
      tags: [slackwatch_skill]

    - name: Warn when no supported agents are found for slackwatch skill
      ansible.builtin.debug:
        msg: >-
          WARNING: Skipping slackwatch skill install because no supported agents were found.
          Nothing was written.
      when:
        - slackwatch_skill_command_check.rc == 0
        - slackwatch_skill_dry_run.rc | default(1) != 0
        - "'no supported agents found' in (slackwatch_skill_dry_run.stderr | default(''))"
      tags: [slackwatch_skill]

    - name: Check slackwatch skill status
      ansible.builtin.command:
        argv:
          - slackwatch
          - skill
          - status
          - --json
      register: slackwatch_skill_status
      changed_when: false
      check_mode: false
      when:
        - slackwatch_skill_command_check.rc == 0
        - slackwatch_skill_dry_run.rc | default(1) == 0
      environment:
        PATH: "{{ slackwatch_skill_env_path }}"
      tags: [slackwatch_skill]

    - name: Determine whether slackwatch skill install is needed
      set_fact:
        slackwatch_skill_target_paths: >-
          {{ slackwatch_skill_dry_run.stdout_lines | default([])
             | select('match', '^would install [^:]+ \(user\): ')
             | map('regex_replace', '^would install [^:]+ \(user\): ', '')
             | list }}
        slackwatch_skill_current_paths: >-
          {{ (slackwatch_skill_status.stdout | from_json).entries | default([])
             | selectattr('scope', 'equalto', 'user')
             | selectattr('status', 'equalto', 'current')
             | map(attribute='path')
             | list }}
      when:
        - slackwatch_skill_command_check.rc == 0
        - slackwatch_skill_dry_run.rc | default(1) == 0
      tags: [slackwatch_skill]

    # --force migrates verified-run-written (foreign) SKILL.md files to
    # toolcli-managed files (including slackwatch-triage when inbound is set).
    # Under --check the command module does not run, so nothing is written.
    - name: Install the slackwatch agent skill
      ansible.builtin.command:
        argv:
          - slackwatch
          - skill
          - install
          - --agent
          - all
          - --force
      register: slackwatch_skill_install
      when:
        - slackwatch_skill_command_check.rc == 0
        - slackwatch_skill_dry_run.rc | default(1) == 0
        - (slackwatch_skill_target_paths | default([]) | difference(slackwatch_skill_current_paths | default([])) | length) > 0
      environment:
        PATH: "{{ slackwatch_skill_env_path }}"
      tags: [slackwatch_skill]
