- import_playbook: gh.yml
- import_playbook: herdr.yml
- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure prsync is present
  hosts: all
  tasks:
    - name: Include guard for prsync playbook
      block:
        - name: Stop early if the prsync playbook is already included
          meta: end_play
          when: prsync_playbook_imported is defined
        - name: Ensure the prsync playbook is not included
          set_fact:
            prsync_playbook_imported: true
          when: prsync_playbook_imported is not defined

    - name: Check if prsync is installed
      shell: go version -m $(command -v prsync) | grep '^\s*mod\s'
      register: prsync_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract prsync version
      block:
        - name: Set prsync facts
          set_fact:
            prsync_module_path: "{{ prsync_installed.stdout.split()[1] }}"
            prsync_module_version: "{{ prsync_installed.stdout.split()[2] }}"
        - name: Determine the latest prsync version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ prsync_module_path }}@latest"
          register: prsync_latest
          ignore_errors: yes
          changed_when: False

        - name: Debug module path and version
          debug:
            msg: "{{ prsync_module_path }} {{ prsync_module_version }} => {{ prsync_latest.stdout }}"
      rescue:
        - name: Clear prsync facts
          set_fact:
            prsync_module_path: ""
            prsync_module_version: ""

    - name: Get prsync build Go version
      shell: go version -m $(command -v prsync) 2>/dev/null | head -1 | awk '{print $2}'
      register: prsync_build_go
      ignore_errors: yes
      changed_when: false

    - name: Upgrade prsync
      command: go install github.com/jaeyeom/experimental/devtools/prsync/cmd/prsync@latest
      register: prsync_upgrade
      until: prsync_upgrade is succeeded
      retries: 3
      delay: 30
      when: >
        prsync_module_version is not defined or
        prsync_module_version == "" or
        prsync_module_version != prsync_latest.stdout or
        prsync_build_go.stdout | default('') != go_toolchain_version
