# and then run: make
- import_playbook: gather-facts.yml
- import_playbook: gh.yml
- import_playbook: herdr.yml
  when: ansible_facts['env']['TERMUX_VERSION'] is not defined
- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure prsync is present
  hosts: all
  # The first file found is loaded. /dev/null keeps a missing vars file
  # from failing the play.
  vars_files:
    - - "{{ (lookup('ansible.builtin.env', 'XDG_CONFIG_HOME') or (lookup('ansible.builtin.env', 'HOME') ~ '/.config')) ~ '/setup-dev/vars.yml' }}"
      - /dev/null
  tasks:
    - name: Include guard for prsync playbook
      block:
        - name: Stop early if the prsync playbook is already included
          meta: end_play
          when: prsync_playbook_imported is defined
        - name: Ensure the prsync playbook is not included
          set_fact:
            prsync_playbook_imported: true
          when: prsync_playbook_imported is not defined

    - name: Check if prsync is installed
      shell: go version -m $(command -v prsync) | grep '^\s*mod\s'
      register: prsync_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract prsync version
      block:
        - name: Set prsync facts
          set_fact:
            prsync_module_path: "{{ prsync_installed.stdout.split()[1] }}"
            prsync_module_version: "{{ prsync_installed.stdout.split()[2] }}"
        - name: Determine the latest prsync version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "github.com/jaeyeom/experimental@{{ experimental_ref | default('main') }}"
          register: prsync_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            prsync_module_path | length > 0 and
            (prsync_module_path == 'github.com/jaeyeom/experimental' or
            'github.com/jaeyeom/experimental'.startswith(prsync_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ prsync_module_path }} {{ prsync_module_version }} => {{ ((prsync_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear prsync facts
          set_fact:
            prsync_module_path: ""
            prsync_module_version: ""

    - name: Get prsync build Go version
      shell: go version -m $(command -v prsync) 2>/dev/null | head -1 | awk '{print $2}'
      register: prsync_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare prsync installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ prsync_module_version | default('') }}"
          - "{{ ((prsync_latest | default({})).stdout | default('')) | trim }}"
          - "{{ prsync_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ prsync_module_path | default('') | trim }}"
          - --target-module
          - github.com/jaeyeom/experimental
      register: prsync_version_check
      changed_when: false
      check_mode: false

    - name: Skip prsync upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping prsync: {{ (prsync_version_check.stdout | from_json).reason }}"
      when: (prsync_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade prsync
      command: go install github.com/jaeyeom/experimental/devtools/prsync/cmd/prsync@{{ experimental_ref | default('main') }}
      register: prsync_upgrade
      until: prsync_upgrade is succeeded
      retries: 3
      delay: 30
      when: (prsync_version_check.stdout | from_json).action == 'install'
