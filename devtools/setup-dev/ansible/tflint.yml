              fi
              unzip -o "$asset"
            )
            install -m 0755 "$workdir/tflint" "{{ user_bin_directory }}/tflint"
          when: tflint_installed.rc != 0
          environment:
            PATH: "{{ user_bin_directory }}:{{ ansible_facts['env']['PATH'] }}"
      when: ansible_facts['env']['TERMUX_VERSION'] is not defined and ansible_facts['os_family'] != "Darwin"
