---
# factory installs with go install on every platform, including Termux.
# The herdr import lives in generated factory.yml and is skipped on Termux.
- import_playbook: factory.yml

- name: Ensure the factory agent skill is installed
  hosts: all
  tasks:
    - name: Include guard for setup-factory playbook
      block:
        - name: Stop early if the setup-factory playbook is already included
          meta: end_play
          when: setup_factory_playbook_imported is defined
        - name: Ensure the setup-factory playbook is not included
          set_fact:
            setup_factory_playbook_imported: true
          when: setup_factory_playbook_imported is not defined

    # The lookups below only read, so they also run under --check; a missing go
    # leaves PATH as is.
    - name: Determine GOPATH for factory commands
      ansible.builtin.command: go env GOPATH
      register: go_env_gopath
      changed_when: false
      failed_when: false
      check_mode: false
      environment:
        GOTOOLCHAIN: local
      tags: [factory_skill]

    - name: Set PATH for factory commands
      set_fact:
        factory_skill_env_path: >-
          {{ (go_env_gopath.stdout ~ '/bin:')
             if (go_env_gopath.rc | default(1)) == 0 and (go_env_gopath.stdout | default('') | length) > 0
             else '' }}{{ ansible_facts['env']['PATH'] }}
      tags: [factory_skill]

    - name: Check whether factory is installed
      ansible.builtin.shell: command -v factory
      register: factory_skill_command_check
      changed_when: false
      failed_when: false
      check_mode: false
      environment:
        PATH: "{{ factory_skill_env_path }}"
      tags: [factory_skill]

    - name: Warn when factory is not installed
      ansible.builtin.debug:
        msg: >-
          WARNING: Skipping factory skill install because factory is not on PATH.
          Nothing was written.
      when: factory_skill_command_check.rc != 0
      tags: [factory_skill]

    - name: Dry-run factory skill install
      ansible.builtin.command:
        argv:
          - factory
          - skill
          - install
          - --agent
          - all
          - --force
          - --dry-run
      register: factory_skill_dry_run
      changed_when: false
      failed_when: >-
        factory_skill_dry_run.rc != 0 and
        'no supported agents found' not in (factory_skill_dry_run.stderr | default(''))
      check_mode: false
      when: factory_skill_command_check.rc == 0
      environment:
        PATH: "{{ factory_skill_env_path }}"
      tags: [factory_skill]

    - name: Warn when no supported agents are found for factory skill
      ansible.builtin.debug:
        msg: >-
          WARNING: Skipping factory skill install because no supported agents were found.
          Nothing was written.
      when:
        - factory_skill_command_check.rc == 0
        - factory_skill_dry_run.rc | default(1) != 0
        - "'no supported agents found' in (factory_skill_dry_run.stderr | default(''))"
      tags: [factory_skill]

    - name: Check factory skill status
      ansible.builtin.command:
        argv:
          - factory
          - skill
          - status
          - --json
      register: factory_skill_status
      changed_when: false
      check_mode: false
      when:
        - factory_skill_command_check.rc == 0
        - factory_skill_dry_run.rc | default(1) == 0
      environment:
        PATH: "{{ factory_skill_env_path }}"
      tags: [factory_skill]

    - name: Determine whether factory skill install is needed
      set_fact:
        factory_skill_target_paths: >-
          {{ factory_skill_dry_run.stdout_lines | default([])
             | select('match', '^would install [^:]+ \(user\): ')
             | map('regex_replace', '^would install [^:]+ \(user\): ', '')
             | list }}
        factory_skill_current_paths: >-
          {{ (factory_skill_status.stdout | from_json).entries | default([])
             | selectattr('scope', 'equalto', 'user')
             | selectattr('status', 'equalto', 'current')
             | map(attribute='path')
             | list }}
      when:
        - factory_skill_command_check.rc == 0
        - factory_skill_dry_run.rc | default(1) == 0
      tags: [factory_skill]

    # --force migrates verified-run-written (foreign) SKILL.md files to
    # toolcli-managed files. Under --check the command module does not run,
    # so nothing is written.
    - name: Install the factory agent skill
      ansible.builtin.command:
        argv:
          - factory
          - skill
          - install
          - --agent
          - all
          - --force
      register: factory_skill_install
      when:
        - factory_skill_command_check.rc == 0
        - factory_skill_dry_run.rc | default(1) == 0
        - (factory_skill_target_paths | default([]) | difference(factory_skill_current_paths | default([])) | length) > 0
      environment:
        PATH: "{{ factory_skill_env_path }}"
      tags: [factory_skill]
