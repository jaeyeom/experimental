- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure gotests is present
  hosts: all
  tasks:
    - name: Include guard for gotests playbook
      block:
        - name: Stop early if the gotests playbook is already included
          meta: end_play
          when: gotests_playbook_imported is defined
        - name: Ensure the gotests playbook is not included
          set_fact:
            gotests_playbook_imported: true
          when: gotests_playbook_imported is not defined

    - name: Check if gotests is installed
      shell: go version -m $(command -v gotests) | grep '^\s*mod\s'
      register: gotests_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract gotests version
      block:
        - name: Set gotests facts
          set_fact:
            gotests_module_path: "{{ gotests_installed.stdout.split()[1] }}"
            gotests_module_version: "{{ gotests_installed.stdout.split()[2] }}"
        - name: Determine the latest gotests version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ gotests_module_path }}@latest"
          register: gotests_latest
          ignore_errors: yes
          changed_when: False

        - name: Debug module path and version
          debug:
            msg: "{{ gotests_module_path }} {{ gotests_module_version }} => {{ gotests_latest.stdout }}"
      rescue:
        - name: Clear gotests facts
          set_fact:
            gotests_module_path: ""
            gotests_module_version: ""

    - name: Get gotests build Go version
      shell: go version -m $(command -v gotests) 2>/dev/null | head -1 | awk '{print $2}'
      register: gotests_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare gotests installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ gotests_module_version | default('') }}"
          - "{{ ((gotests_latest | default({})).stdout | default('')) | trim }}"
          - "{{ gotests_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
      register: gotests_version_check
      changed_when: false
      check_mode: false

    - name: Skip gotests upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping gotests: {{ (gotests_version_check.stdout | from_json).reason }}"
      when: (gotests_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade gotests
      command: go install github.com/cweill/gotests/gotests@latest
      register: gotests_upgrade
      until: gotests_upgrade is succeeded
      retries: 3
      delay: 30
      when: (gotests_version_check.stdout | from_json).action == 'install'
