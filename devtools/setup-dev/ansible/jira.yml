# and then run: make
- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure jira is present
  hosts: all
  tasks:
    - name: Include guard for jira playbook
      block:
        - name: Stop early if the jira playbook is already included
          meta: end_play
          when: jira_playbook_imported is defined
        - name: Ensure the jira playbook is not included
          set_fact:
            jira_playbook_imported: true
          when: jira_playbook_imported is not defined

    - name: Check if jira is installed
      shell: go version -m $(command -v jira) | grep '^\s*mod\s'
      register: jira_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract jira version
      block:
        - name: Set jira facts
          set_fact:
            jira_module_path: "{{ jira_installed.stdout.split()[1] }}"
            jira_module_version: "{{ jira_installed.stdout.split()[2] }}"
        - name: Determine the latest jira version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ jira_module_path }}@latest"
          register: jira_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            jira_module_path | length > 0 and
            (jira_module_path == 'github.com/ankitpokhrel/jira-cli/cmd/jira' or
            'github.com/ankitpokhrel/jira-cli/cmd/jira'.startswith(jira_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ jira_module_path }} {{ jira_module_version }} => {{ ((jira_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear jira facts
          set_fact:
            jira_module_path: ""
            jira_module_version: ""

    - name: Get jira build Go version
      shell: go version -m $(command -v jira) 2>/dev/null | head -1 | awk '{print $2}'
      register: jira_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare jira installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ jira_module_version | default('') }}"
          - "{{ ((jira_latest | default({})).stdout | default('')) | trim }}"
          - "{{ jira_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ jira_module_path | default('') | trim }}"
          - --target-module
          - github.com/ankitpokhrel/jira-cli/cmd/jira
      register: jira_version_check
      changed_when: false
      check_mode: false

    - name: Skip jira upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping jira: {{ (jira_version_check.stdout | from_json).reason }}"
      when: (jira_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade jira
      command: go install github.com/ankitpokhrel/jira-cli/cmd/jira@latest
      register: jira_upgrade
      until: jira_upgrade is succeeded
      retries: 3
      delay: 30
      when: (jira_version_check.stdout | from_json).action == 'install'
