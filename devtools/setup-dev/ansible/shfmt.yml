# and then run: make
- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure shfmt is present
  hosts: all
  tasks:
    - name: Include guard for shfmt playbook
      block:
        - name: Stop early if the shfmt playbook is already included
          meta: end_play
          when: shfmt_playbook_imported is defined
        - name: Ensure the shfmt playbook is not included
          set_fact:
            shfmt_playbook_imported: true
          when: shfmt_playbook_imported is not defined

    - name: Check if shfmt is installed
      shell: go version -m $(command -v shfmt) | grep '^\s*mod\s'
      register: shfmt_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract shfmt version
      block:
        - name: Set shfmt facts
          set_fact:
            shfmt_module_path: "{{ shfmt_installed.stdout.split()[1] }}"
            shfmt_module_version: "{{ shfmt_installed.stdout.split()[2] }}"
        - name: Determine the latest shfmt version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ shfmt_module_path }}@latest"
          register: shfmt_latest
          ignore_errors: yes
          changed_when: False

        - name: Debug module path and version
          debug:
            msg: "{{ shfmt_module_path }} {{ shfmt_module_version }} => {{ shfmt_latest.stdout }}"
      rescue:
        - name: Clear shfmt facts
          set_fact:
            shfmt_module_path: ""
            shfmt_module_version: ""

    - name: Get shfmt build Go version
      shell: go version -m $(command -v shfmt) 2>/dev/null | head -1 | awk '{print $2}'
      register: shfmt_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare shfmt installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ shfmt_module_version | default('') }}"
          - "{{ ((shfmt_latest | default({})).stdout | default('')) | trim }}"
          - "{{ shfmt_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
      register: shfmt_version_check
      changed_when: false
      check_mode: false

    - name: Skip shfmt upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping shfmt: {{ (shfmt_version_check.stdout | from_json).reason }}"
      when: (shfmt_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade shfmt
      command: go install mvdan.cc/sh/v3/cmd/shfmt@latest
      register: shfmt_upgrade
      until: shfmt_upgrade is succeeded
      retries: 3
      delay: 30
      when: (shfmt_version_check.stdout | from_json).action == 'install'
