# and then run: make
- import_playbook: setup-user-go-bin-directory.yml

- name: Ensure godoc is present
  hosts: all
  tasks:
    - name: Include guard for godoc playbook
      block:
        - name: Stop early if the godoc playbook is already included
          meta: end_play
          when: godoc_playbook_imported is defined
        - name: Ensure the godoc playbook is not included
          set_fact:
            godoc_playbook_imported: true
          when: godoc_playbook_imported is not defined

    - name: Check if godoc is installed
      shell: go version -m $(command -v godoc) | grep '^\s*mod\s'
      register: godoc_installed
      ignore_errors: yes
      changed_when: False

    - name: Extract godoc version
      block:
        - name: Set godoc facts
          set_fact:
            godoc_module_path: "{{ godoc_installed.stdout.split()[1] }}"
            godoc_module_version: "{{ godoc_installed.stdout.split()[2] }}"
        - name: Determine the latest godoc version
          command: go list -m -f "{{ '{{' }}.Version {{ '}}' }}" "{{ godoc_module_path }}@latest"
          register: godoc_latest
          ignore_errors: yes
          changed_when: False
          when: >-
            godoc_module_path | length > 0 and
            (godoc_module_path == 'golang.org/x/tools/cmd/godoc' or
            'golang.org/x/tools/cmd/godoc'.startswith(godoc_module_path ~ '/'))

        - name: Debug module path and version
          debug:
            msg: "{{ godoc_module_path }} {{ godoc_module_version }} => {{ ((godoc_latest | default({})).stdout | default('')) | trim }}"
      rescue:
        - name: Clear godoc facts
          set_fact:
            godoc_module_path: ""
            godoc_module_version: ""

    - name: Get godoc build Go version
      shell: go version -m $(command -v godoc) 2>/dev/null | head -1 | awk '{print $2}'
      register: godoc_build_go
      ignore_errors: yes
      changed_when: false

    - name: Compare godoc installed and target versions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/go_version_compare.py"
          - "{{ godoc_module_version | default('') }}"
          - "{{ ((godoc_latest | default({})).stdout | default('')) | trim }}"
          - "{{ godoc_build_go.stdout | default('') | trim }}"
          - "{{ go_toolchain_version | default('') | trim }}"
          - --installed-module
          - "{{ godoc_module_path | default('') | trim }}"
          - --target-module
          - golang.org/x/tools/cmd/godoc
      register: godoc_version_check
      changed_when: false
      check_mode: false

    - name: Skip godoc upgrade when target is not newer
      ansible.builtin.debug:
        msg: "Skipping godoc: {{ (godoc_version_check.stdout | from_json).reason }}"
      when: (godoc_version_check.stdout | from_json).action in ['skip_older', 'skip_unresolved']

    - name: Upgrade godoc
      command: go install golang.org/x/tools/cmd/godoc@latest
      register: godoc_upgrade
      until: godoc_upgrade is succeeded
      retries: 3
      delay: 30
      when: (godoc_version_check.stdout | from_json).action == 'install'
