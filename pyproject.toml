[project]
name = "experimental"
version = "0.1.0"
description = "Monorepo"
readme = "README.org"
requires-python = ">=3.11"
authors = [{ name = "Jaehyun Yeom", email = "jae.yeom@gmail.com" }]
dependencies = [
    "grpcio",
    "protobuf",
    "protovalidate",
]

[dependency-groups]
dev = ["pytest"]

# Newly published grpcio would be excluded by a 7-day cooldown.
# nosemgrep: uv-missing-dependency-cooldown
[tool.uv]
package = false

[tool.ruff]
extend-exclude = [
    "*_pb2.py",       # Generated protobuf
    "*_pb2_grpc.py",  # Generated gRPC
    "bazel-*",        # Bazel
]

# PEP 8 recommends line-length 79
line-length = 79
indent-width = 4

fix = true

[tool.ruff.lint]
extend-select = ["UP", "D"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
# gen/ holds buf-generated protobuf modules imported as a local package
# (e.g. codelab/proto/gen). It is not reachable from `src`, so isort would
# otherwise sort it into the third-party block.
known-first-party = ["gen"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "preserve"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pydocstyle]
# My default choice is Google style because the docstring is concise yet
# visually easy to understand.
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "codelab/proto"
files = [
    "codelab/proto/client.py",
    "codelab/proto/server.py",
    "codelab/proto/client_test.py",
    "codelab/proto/server_test.py",
]
exclude = [
    "(^|/)gen/",
    ".*_pb2\\.py$",
    ".*_pb2_grpc\\.py$",
    "^bazel-",
]
# Host mypy is an isolated uv tool; grpcio/pytest/protovalidate are not
# installed next to it. Generated pb2 modules build messages dynamically.
ignore_missing_imports = true
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["gen", "gen.*"]
follow_imports = "skip"
