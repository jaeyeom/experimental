[project]
name = "experimental"
version = "0.1.0"
description = "Monorepo"
readme = "README.org"
requires-python = ">=3.11"
authors = [{ name = "Jaehyun Yeom", email = "jae.yeom@gmail.com" }]
dependencies = [
    "grpcio",
    "protobuf",
    "protovalidate",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    # Semgrep dropped macOS x86_64 wheels in 1.83.0.
    "semgrep; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.ruff]
extend-exclude = [
    "*_pb2.py",       # Generated protobuf
    "*_pb2_grpc.py",  # Generated gRPC
    "bazel-*",        # Bazel
]

# PEP 8 recommends line-length 79
line-length = 79
indent-width = 4

fix = true

[tool.ruff.lint]
extend-select = ["UP", "D"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
# gen/ holds buf-generated protobuf modules imported as a local package
# (e.g. codelab/proto/gen). It is not reachable from `src`, so isort would
# otherwise sort it into the third-party block.
known-first-party = ["gen"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "preserve"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pydocstyle]
# My default choice is Google style because the docstring is concise yet
# visually easy to understand.
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "codelab/proto:devtools/linters/pylinters/src"
files = [
    "codelab/proto/client.py",
    "codelab/proto/server.py",
    "codelab/proto/client_test.py",
    "codelab/proto/server_test.py",
    "devtools/decide/contrib/panels/agent_memory.py",
    "devtools/decide/contrib/panels/agent_memory_test.py",
    "devtools/decide/contrib/panels/tokens.py",
    "devtools/decide/contrib/panels/tokens_test.py",
    "scripts/strip_pr_html_comments.py",
    "scripts/strip_pr_html_comments_test.py",
    "devtools/linters/pylinters/src/pylinters",
    "devtools/linters/pylinters/tests",
    "tools/lint/bazel_go_files_test.py",
    "tools/lint/gitleaks_test.py",
    "tools/lint/mypy_test.py",
    "tools/lint/semgrep_files_test.py",
    "tools/lint/semgrep_test.py",
    "tools/lint/uv_lock_test.py",
]
exclude = [
    "(^|/)gen/",
    ".*_pb2\\.py$",
    ".*_pb2_grpc\\.py$",
    "^bazel-",
]
# Generated pb2/gRPC base classes and grpcio lack full type stubs.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["gen", "gen.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ruamel", "ruamel.*"]
ignore_missing_imports = true

[tool.pylinters.main-guard]
# Every py_test here runs as __main__ under Bazel, so its file must end
# with a runner that propagates the exit code.
require-test-runner = true
