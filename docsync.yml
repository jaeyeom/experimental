# Curated code → doc index. Matching is root-anchored (no implicit **/).
# Schema: devtools/docsync/docsync.yml.example
#
# Built by walking every tracked doc section onto the source it describes,
# then walking source packages back onto those sections.
#
# Intentionally unmapped (no honest product-doc pair):
# - Flutter template / LaunchImage READMEs
# - spacemacs/private/local/README.md (upstream boilerplate)
# - text/markdown/linkfix, tools/mdlinkfix (no README)
# - codelab/{go,coffee,csharp,unison,proto} toys
# - v3/ (generated Bazel module cache, not source)
# - Historical plans as live targets: storage-design.md,
#   repo-sync/IMPLEMENTATION_PLAN.md, ansible/TODO.org
# - gitignored docs/superpowers/ (python-modern-practices spec/plan)
# - .agent/workflows (no parent doc)
# - test-create-image.el, test-image-size.el, scripts/update-env-keys.sh

version: 1
rules:
  # --- repository root: Make / Bazel / toolchain ---
  - match: ["Makefile"]
    docs:
      - path: README.org
        section: "** GNU Make"
        why: "make check/test/lint/format/fix/coverage targets"
      - path: README.org
        section: "* Development Workflow"
        why: "run make check before requesting a commit"
      - path: CLAUDE.md
        section: "## Automation & Workflow"
        why: "always run make check; use make format"
      - path: CLAUDE.md
        section: "## Temp File Handling"
        why: "golangci-lint config hash is cached under .tmp/"
      - path: AGENTS.md
        why: "make check before signaling completion"

  - match: [".gitignore"]
    docs:
      - path: CLAUDE.md
        section: "## Temp File Handling"
        why: "project-local .tmp/ is gitignored"

  - match: ["MODULE.bazel", ".bazeliskrc", "BUILD.bazel", ".bazelrc"]
    docs:
      - path: README.org
        section: "** Bazel"
        why: "Bazelisk, Go SDK, nogo, Gazelle, format alias, Termux nogo skip"

  - match: ["go.mod", "pyproject.toml", "uv.lock"]
    docs:
      - path: README.org
        section: "* Getting Started"
        why: "Go module path, uv lockfile, listed linters"

  - match: [".golangci.yml"]
    docs:
      - path: README.org
        section: "* Getting Started"
        why: "golangci-lint is part of make lint"
      - path: README.org
        section: "** GNU Make"
        why: "make lint-golangci / verify-golangci-config"
      - path: SECURITY.md
        section: "## Security Practices"
        why: "static analysis via golangci-lint"

  - match: [".semgrep/**"]
    docs:
      - path: README.org
        section: "* Getting Started"
        why: "semgrep is a listed linter"
      - path: README.org
        section: "** GNU Make"
        why: "make check-semgrep is part of make check"

  - match: ["check-oserrorsgodernize.sh"]
    docs:
      - path: README.org
        section: "* Getting Started"
        why: "oserrorsgodernize must be built against golang.org/x/tools >= v0.49.0"

  - match: ["check-bazel-src-files.sh"]
    docs:
      - path: README.org
        section: "** GNU Make"
        why: "make check-bazel-go-files runs check-bazel-src-files.sh"
      - path: tools/org-lint/README.md
        why: "same completeness-check pattern as org_lint_tests"

  - match: ["tools/format/**"]
    docs:
      - path: README.org
        section: "** GNU Make"
        why: "make format / check-format drive //tools/format"
      - path: CLAUDE.md
        section: "## Automation & Workflow"
        why: "use make format instead of gofmt/goimports directly"

  - match: ["tools/lint/**"]
    docs:
      - path: README.org
        section: "** Bazel"
        why: "nogo static analysis via //tools/lint"

  - match: ["PklProject", "PklProject.deps.json"]
    docs:
      - path: README.org
        section: "** Bazel"
        why: "rules_pkl / pkl-go pin for configuration codegen"
      - path: devtools/gh-nudge/README.org
        section: "*** Pkl Configuration (Recommended)"
        why: "pkl-gen-go resolved through repo-root PklProject"

  - match:
      - "scripts/strip_pr_html_comments.py"
      - ".github/workflows/strip-pr-html-comments.yml"
      - ".github/pull_request_template.md"
    docs:
      - path: CLAUDE.md
        section: "## Pull requests"
        why: "squash-merge copies HTML comments; reusable strip workflow"
      - path: AGENTS.md
        why: "omit template HTML comments from PR bodies"

  - match: [".github/workflows/bazel-test.yml"]
